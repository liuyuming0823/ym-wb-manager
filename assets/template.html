<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkBuddy 管理中心</title>
<style>
:root{
  --bg:#f4f6f9; --side:#1e2430; --side-2:#262e3d; --side-tx:#aeb7c6;
  --panel:#ffffff; --panel-2:#fafbfc; --line:#e3e6ea; --line-2:#eef0f3;
  --text:#1f2329; --text-2:#5c6470; --text-3:#8a919e;
  --accent:#2b6cff; --accent-soft:#eaf1ff;
  --ok:#1a7f47; --ok-soft:#e6f4ec;
  --warn:#a86300; --warn-soft:#fdf3e3;
  --err:#c0392b; --err-soft:#fdecea;
  --purple:#6a4bd0; --purple-soft:#f0ebfd;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 12px 40px rgba(16,24,40,.18);
  --radius:10px; --side-w:214px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font:14px/1.6 "PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,"Courier New",monospace;font-size:12.5px}

/* ================= 布局 ================= */
.app{display:flex;min-height:100vh}

/* ---------- 侧边栏 ---------- */
aside{
  width:var(--side-w);flex:none;background:var(--side);color:var(--side-tx);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:18px 18px 14px;display:flex;align-items:center;gap:9px}
.brand .logo{
  width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3d7bff,#7a4bff);
  display:grid;place-items:center;font-size:14px;flex:none;
}
.brand .t{color:#fff;font-weight:650;font-size:14.5px;letter-spacing:-.2px;white-space:nowrap}
.brand .t small{display:block;font-size:10.5px;color:#7b879b;font-weight:400;letter-spacing:0}

nav{padding:6px 10px;flex:1;overflow-y:auto}
.nav-t{
  font-size:10.5px;color:#6b7688;font-weight:600;letter-spacing:.8px;
  padding:12px 9px 6px;text-transform:uppercase;
}
.nav-i{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;
  font-size:13.5px;cursor:pointer;color:var(--side-tx);user-select:none;
  border:0;background:none;width:100%;font-family:inherit;text-align:left;
  transition:background .12s,color .12s;
}
.nav-i:hover{background:var(--side-2);color:#e8ecf3}
.nav-i.on{background:var(--accent);color:#fff;font-weight:600}
.nav-i .i{width:16px;text-align:center;flex:none;font-size:14px;opacity:.9}
.nav-i .n{
  margin-left:auto;font-size:11px;background:rgba(255,255,255,.1);
  padding:1px 7px;border-radius:100px;font-weight:600;
}
.nav-i.on .n{background:rgba(255,255,255,.24)}
.side-f{margin-top:auto;padding:10px}
.side-f .btn{width:100%;background:var(--side-2);border-color:transparent;color:#cbd3df;font-size:12.5px;padding:7px}
.side-f .btn:hover{background:#303a4c;color:#fff}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.hwrap{padding:13px 22px}
.htop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:16.5px;margin:0;font-weight:650;letter-spacing:-.2px;white-space:nowrap}
h1 .sub{font-size:12.5px;font-weight:400;color:var(--text-3);margin-left:9px}
.spacer{flex:1}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:11px}

/* 统计卡片（可点） */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;margin-bottom:16px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;
  transition:border-color .12s,transform .12s,box-shadow .12s;
}
.card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 14px rgba(16,24,40,.09)}
.card.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.card.flat{cursor:default}
.card.flat:hover{border-color:var(--line);transform:none;box-shadow:var(--shadow)}
.card .k{font-size:11.5px;color:var(--text-3);margin-bottom:3px;display:flex;align-items:center;gap:5px}
.card .v{font-size:22px;font-weight:650;color:var(--text);line-height:1.2;letter-spacing:-.5px}
.card .v small{font-size:12px;font-weight:400;color:var(--text-3);margin-left:3px}
.card .d{font-size:11px;color:var(--text-3);margin-top:3px}
.card.on .k,.card.on .d{color:#1c4fa8}
.card.on .v{color:#1c4fa8}
.card.c-warn .v{color:var(--warn)}
.card.c-err .v{color:var(--err)}
.card.c-ok .v{color:var(--ok)}
.card.c-purple .v{color:var(--purple)}

/* 工具条 */
.search{flex:1;min-width:200px;position:relative}
.search input{
  width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;
  font-size:13.5px;background:var(--panel);color:var(--text);outline:none;font-family:inherit;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search::before{
  content:"";position:absolute;left:11px;top:50%;width:12px;height:12px;margin-top:-7px;
  border:2px solid var(--text-3);border-radius:50%;
}
.search::after{
  content:"";position:absolute;left:20px;top:50%;width:6px;height:2px;margin-top:3px;
  background:var(--text-3);transform:rotate(45deg);border-radius:1px;
}
select,.btn{
  padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  font-size:13px;color:var(--text);cursor:pointer;font-family:inherit;outline:none;
}
select:focus,.btn:focus{border-color:var(--accent)}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:550}
.btn.primary:hover{background:#1f5ee6}
.btn.danger{color:var(--err);border-color:#f0c8c3}
.btn.danger:hover{background:var(--err-soft)}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{flex:1;padding:18px 22px 70px;max-width:1560px;width:100%}

/* ================= 任务列表（紧凑列表式） ================= */
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;color:var(--text-3)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;transition:border-color .12s;
}
.row:hover{border-color:#d3d8e0}
.rhead{display:flex;gap:11px;align-items:flex-start;padding:10px 13px;cursor:pointer}
.rhead:hover{background:var(--panel-2)}
.caret{
  flex:none;width:14px;color:var(--text-3);font-size:10px;padding-top:4px;
  transition:transform .15s;user-select:none;text-align:center;
}
.row.open .caret{transform:rotate(90deg)}
.rmain{flex:1;min-width:0}
.rl1{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.rname{font-weight:600;font-size:13.5px;color:var(--text);word-break:break-word;cursor:pointer}
.rname:hover{color:var(--accent)}
.rmeta{display:flex;gap:13px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--text-3)}
.rmeta .mono{color:var(--text-2)}
.rright{display:flex;gap:13px;flex:none;font-size:12px;color:var(--text-3);padding-top:4px;white-space:nowrap;align-items:center}
.rright b{color:var(--text-2);font-weight:600}
.rprompt{
  margin-top:6px;font-size:12px;color:var(--text-2);background:var(--panel-2);
  border-left:2px solid var(--line);padding:4px 9px;border-radius:0 5px 5px 0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* 徽章 */
.badges{display:flex;gap:5px;flex-wrap:wrap;flex:none}
.badge{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:550;white-space:nowrap;border:1px solid transparent}
.b-run{background:var(--accent-soft);color:#1c4fa8;border-color:#cfe0ff}
.b-done{background:var(--ok-soft);color:var(--ok);border-color:#c8e6d5}
.b-warn{background:var(--warn-soft);color:var(--warn);border-color:#f0ddb8}
.b-err{background:var(--err-soft);color:var(--err);border-color:#f5cdc8}
.b-mode{background:var(--panel-2);color:var(--text-2);border-color:var(--line)}
.b-exp{background:var(--purple-soft);color:var(--purple);border-color:#ddd0fa}
.b-auto{background:var(--warn-soft);color:var(--warn);border-color:#f5e0bb}
.b-del{background:#f1f2f4;color:var(--text-3);border-color:var(--line)}
.b-lost{background:var(--err-soft);color:var(--err);border-color:#f5cdc8}
.b-stale{background:var(--warn-soft);color:var(--warn);border-color:#f5e0bb}
.b-nul{background:#f1f2f4;color:var(--text-3);border-color:var(--line)}
.b-off{background:var(--panel-2);color:var(--text-3);border-color:var(--line)}

/* 详情 */
.rbody{display:none;border-top:1px solid var(--line-2);padding:13px 15px;background:var(--panel-2)}
.row.open .rbody{display:block}
.sect{margin-bottom:15px}
.sect:last-child{margin-bottom:0}
.sect-t{
  font-size:11.5px;font-weight:650;color:var(--text-3);letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:8px;
}
.sect-t::after{content:"";flex:1;height:1px;background:var(--line)}
.kv{display:grid;grid-template-columns:74px 1fr;gap:3px 12px;font-size:13px;align-items:baseline}
.kv dt{color:var(--text-3);font-size:12.5px}
.kv dd{margin:0;word-break:break-all;color:var(--text-2)}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.act{
  font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel);color:var(--text-2);cursor:pointer;font-family:inherit;
}
.act:hover{border-color:var(--accent);color:var(--accent)}
.act.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.act.pri:hover{background:#1f5ee6;color:#fff}
.act.danger{color:var(--err);border-color:#f0c8c3}
.act.danger:hover{background:var(--err-soft);border-color:var(--err)}
.act.ghost{border-style:dashed}

/* 产物 */
.arts{display:flex;flex-direction:column;gap:4px}
.art{display:flex;gap:8px;align-items:center;padding:5px 9px;background:var(--panel);border:1px solid var(--line-2);border-radius:7px;font-size:12.5px}
.art:hover{border-color:#d3d8e0}
.ic{flex:none;width:24px;height:19px;border-radius:4px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff}
.ic-doc{background:#4a7fd4}.ic-img{background:#c47f1a}.ic-vid{background:#a04ad4}
.ic-zip{background:#5c6470}.ic-code{background:#1a9e6a}.ic-diff{background:#8a919e}
.ic-plan{background:#2b6cff}.ic-other{background:#9aa1ad}
.art-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.art-n:hover{color:var(--accent)}
.art-p{flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-3);font-size:11.5px}
.art-s{flex:none;color:var(--text-3);font-size:11.5px;min-width:54px;text-align:right}
.miss{color:var(--err);font-size:11px;flex:none}
.art-copy{flex:none;font-size:11px;color:var(--text-3);cursor:pointer;padding:1px 5px;border-radius:4px;border:1px solid transparent}
.art-copy:hover{border-color:var(--line);color:var(--accent)}

/* Todo */
.todos{display:flex;flex-direction:column;gap:3px}
.todo{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:3px 0}
.todo .mk{flex:none;width:15px;height:15px;border-radius:50%;margin-top:2px;font-size:10px;display:grid;place-items:center;border:1.5px solid var(--line)}
.todo.done .mk{background:var(--ok);border-color:var(--ok);color:#fff}
.todo.done .tx{color:var(--text-3);text-decoration:line-through}
.todo.prog .mk{border-color:var(--accent);background:var(--accent);color:#fff}
.todo .tx{color:var(--text-2)}

/* 用量 */
.ug{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:7px}
.ug-item{background:var(--panel);border:1px solid var(--line-2);border-radius:7px;padding:7px 10px}
.ug-k{font-size:11.5px;color:var(--text-3);margin-bottom:1px}
.ug-v{font-size:15.5px;font-weight:650;color:var(--text)}
.ug-v small{font-size:11.5px;font-weight:400;color:var(--text-3);margin-left:3px}
.bar-o{height:5px;background:var(--line-2);border-radius:3px;margin-top:5px;overflow:hidden}
.bar-i{height:100%;background:var(--accent);border-radius:3px}
.cr{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.cr-i{background:var(--panel);border:1px solid var(--line-2);border-radius:5px;padding:2px 8px;font-size:11.5px;color:var(--text-2)}
.cr-i b{color:var(--text);font-weight:600}

/* ================= 项目 / 资料库 / 表格 ================= */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:11px}
.pcard{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 15px;box-shadow:var(--shadow);transition:border-color .12s;
}
.pcard:hover{border-color:#d3d8e0}
.pcard .pn{font-weight:640;font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:6px}
/* 路径只留最后两段，全路径放 title —— 长路径会把卡片撑得高低不齐 */
.pcard .pp{font-size:11.5px;color:var(--text-3);word-break:break-all;margin-bottom:8px;line-height:1.5}
.pcard .pp.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal;direction:rtl;text-align:left}
.pcard .pst{display:flex;gap:11px;flex-wrap:wrap;font-size:12px;color:var(--text-3);margin-bottom:9px}
.pcard .pst b{color:var(--text-2);font-weight:600}
.pcard .acts{margin-top:0}
.pcard.miss{border-style:dashed;border-color:#e0c9a0;background:var(--warn-soft)}

/* 资料库分页签 */
.tabs{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px;padding-bottom:0}
.tabs .tab{
  background:transparent;border:1px solid transparent;border-bottom:2px solid transparent;
  padding:7px 13px 8px;font-size:13px;color:var(--text-2);cursor:pointer;border-radius:7px 7px 0 0;
  font-family:inherit;display:inline-flex;align-items:center;gap:6px;margin-bottom:-1px;
}
.tabs .tab:hover{background:var(--hover, rgba(0,0,0,.03));color:var(--text)}
.tabs .tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:640}
.tabs .tab .tabn{
  font-size:11px;background:var(--line);color:var(--text-3);border-radius:9px;
  padding:0 6px;line-height:16px;font-weight:500;
}
.tabs .tab.on .tabn{background:var(--accent-soft,#e8f0fe);color:var(--accent)}

.tbl{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:13px}
.tbl th{
  text-align:left;font-size:11.5px;font-weight:650;color:var(--text-3);letter-spacing:.4px;
  padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel-2);white-space:nowrap;
}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--panel-2)}
.tbl .nm{font-weight:600;color:var(--text)}
.tbl .pth{font-size:11.5px;color:var(--text-3);word-break:break-all;max-width:420px}
/* 时间类单元格不许折行（否则 "2026-09-15 23:50" 会被挤成两行，很难看） */
.tbl td.nowrap{white-space:nowrap}
/* 表格里的名称列限宽，避免长任务名把后面的列挤变形 */
.tbl td.c-name{max-width:300px}
.tbl td.c-name .nm{word-break:break-word}

/* ================= 任务列表（表格式，默认形态） ================= */
/* 明哥要求：默认是「带表头的列表」，卡片内容收进详情。 */
/*
 * 布局策略（2026-09-20 第二版）：
 *   1. 默认**整表刚好占满一屏宽**，不出现横向滚动条；
 *      内容超出靠省略号，不换行 —— 这样一屏能看到最多行。
 *   2. 列宽用 table-layout:fixed + 百分比分配，让浏览器按比例分，
 *      不按内容撑 —— 否则长任务名会把整张表顶得很宽。
 *   3. 窄屏（<1180px）才启用横向滚动兜底，保证列不被压成一字一行。
 */
.lt-wrap{overflow-x:auto;border-radius:var(--radius);
  box-shadow:var(--shadow);border:1px solid var(--line);background:var(--panel)}
.lt-wrap::-webkit-scrollbar{height:9px}
.lt-wrap::-webkit-scrollbar-thumb{background:#c8cfda;border-radius:5px}
.lt-wrap::-webkit-scrollbar-track{background:var(--panel-2)}
.lt{width:100%;min-width:1080px;table-layout:fixed;
    border-collapse:separate;border-spacing:0;background:var(--panel);font-size:13px}
.lt th{
  text-align:left;font-size:11.5px;font-weight:650;color:var(--text-3);letter-spacing:.4px;
  padding:9px 11px;border-bottom:1px solid var(--line);background:var(--panel-2);
  white-space:nowrap;position:sticky;top:0;z-index:2;
  /* 表头也省略号：窄屏时「标题（手动）」这类长表头不许折行 */
  overflow:hidden;text-overflow:ellipsis;
}
/* ---- 列宽拖拽手柄 ----
   贴在表头右边缘的一条细线，鼠标移上去变粗、变色。
   为什么做成「贴边 5px 命中区 + 1px 视觉线」而不是整块可拖：
   整块可拖会和「点表头排序」抢事件，用户想排序时经常会拖到列宽。 */
.lt th{position:relative}
.lt th .rsz{
  position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;
  user-select:none;z-index:3;
}
.lt th .rsz::after{
  content:"";position:absolute;top:20%;right:2px;width:1px;height:60%;
  background:var(--line);transition:background .12s,width .12s;
}
.lt th .rsz:hover::after,.lt th .rsz.on::after{background:var(--accent);width:2px}
/* 拖拽期间：全局禁选文字，光标保持 col-resize（否则拖到表格外光标会变） */
body.col-resizing{cursor:col-resize;user-select:none}
body.col-resizing *{cursor:col-resize !important}
/* 表格已按用户设的宽度渲染过 —— 关掉自动布局，让宽度说了算 */
.lt.fixed{table-layout:fixed}
/* 可排序的表头 */
.lt th.srt{cursor:pointer;user-select:none}
.lt th.srt:hover{color:var(--accent)}
.lt th.srt .ar{opacity:.35;margin-left:3px;font-size:9px}
.lt th.srt.on{color:var(--accent)}
.lt th.srt.on .ar{opacity:1}
.lt td{
  padding:7px 11px;border-bottom:1px solid var(--line-2);vertical-align:top;
  /* 关键的三个：超出即省略号、绝不换行 */
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lt tbody tr:last-child td{border-bottom:0}
/* 整行可点：点行展开详情（明哥要求「取消操作列，点行展开」）。
   用 cursor:pointer 明确告诉用户这行能点 —— 没有操作列之后，
   如果光标还是箭头，用户根本不知道还能展开。 */
.lt tbody tr{cursor:pointer}
.lt tbody tr:hover td{background:var(--panel-2)}
.lt tbody tr.open td{background:var(--accent-soft)}
.lt tbody tr.open:hover td{background:var(--accent-soft)}
/* 展开行本身不再响应点击（它里面是可读的详情，不是行） */
.lt tbody tr.exp-row{cursor:default}
.lt td.nowrap{white-space:nowrap}
/* 展开行里的内容要能换行（它是详情，不是列表） */
.lt tr.exp-row>td{white-space:normal;overflow:visible;padding:0}
/* 列宽：百分比分配，加起来 100%。列表默认刚好一屏宽。
   ⚠️ 这些只是**默认值**。用户拖过列宽之后，实际宽度以 <colgroup> 上的
   内联样式为准（见 applyColWidths()），这些规则就被覆盖了。 */
.lt th.c-name,.lt td.c-name{width:19%}
.lt th.c-cwd,.lt td.c-cwd{width:16%}
.lt th.c-created,.lt td.c-created{width:10%}
.lt th.c-updated,.lt td.c-updated{width:11%}
.lt th.c-auto,.lt td.c-auto{width:15%}
.lt th.c-mode,.lt td.c-mode{width:6%}
.lt th.c-model,.lt td.c-model{width:10%}
.lt th.c-path,.lt td.c-path{width:8%}
.lt th.c-title,.lt td.c-title{width:5%}
/* 扩展列表的列宽（同样按比例分配，加起来 100%） */
.lt th.c-pname,.lt td.c-pname{width:20%}
.lt th.c-pkind,.lt td.c-pkind{width:8%}
.lt th.c-psrc,.lt td.c-psrc{width:10%}
.lt th.c-pdesc,.lt td.c-pdesc{width:28%}
.lt th.c-pver,.lt td.c-pver{width:8%}
.lt th.c-pauth,.lt td.c-pauth{width:10%}
.lt th.c-pupd,.lt td.c-pupd{width:9%}
.lt th.c-pstat,.lt td.c-pstat{width:7%}
/* 在线搜索结果表 */
.lt th.c-oname,.lt td.c-oname{width:24%}
.lt th.c-oauthor,.lt td.c-oauthor{width:13%}
.lt th.c-odesc,.lt td.c-odesc{width:32%}
.lt th.c-over,.lt td.c-over{width:8%}
.lt th.c-odl,.lt td.c-odl{width:10%}
.lt th.c-ostat,.lt td.c-ostat{width:13%}
/* 省略号统一工具类（td 上已有 overflow:hidden，这里只管行内的块级容器） */
.lt .ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%}
/* 表格里的任务名：**默认不是编辑态**，点它=打开任务。
   改名要走右侧的小铅笔图标（明哥要求：避免误操作）。 */
.lt .ename{
  font-weight:600;color:var(--text);cursor:pointer;border-radius:4px;
  padding:1px 4px;margin-left:-4px;display:block;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.lt .ename:hover{color:var(--accent)}
/* 没手动起过名的任务，标题用浅色，一眼能看出「这个还没命名」 */
.lt .ename.unnamed{color:var(--text-2);font-weight:550}
/* 小铅笔按钮 —— 起改标题的作用，点它才进编辑态 */
.lt .pencil{
  flex:none;border:0;background:none;cursor:pointer;font-size:12px;line-height:1;
  color:var(--text-3);padding:2px 3px;border-radius:4px;opacity:.5;
  font-family:inherit;transition:opacity .12s,background .12s,color .12s;
}
.lt tbody tr:hover .pencil{opacity:1}
.lt .pencil:hover{background:var(--accent-soft);color:var(--accent)}
/* 「标题（手动）」单元格：文字 + 铅笔并排 */
.lt .tc{display:flex;align-items:center;gap:2px;min-width:0}
.lt .tc .ename{flex:1;min-width:0}
/* 行内编辑输入框 */
.lt input.rin{
  width:100%;padding:3px 7px;border:1px solid var(--accent);border-radius:5px;
  font-size:12.5px;font-family:inherit;outline:none;color:var(--text);background:#fff;
  box-shadow:0 0 0 3px var(--accent-soft);
}
.lt .sub2{font-size:11.5px;color:var(--text-3);margin-top:2px;display:block}
/* 行首的状态徽章：跟在任务名下面，不参与省略号（它是块级换行） */
.lt .rbadges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
/* 操作列的图标按钮横排 */
.lt .ico{display:flex;gap:2px;align-items:center}
.lt .ico button{
  border:0;background:none;cursor:pointer;font-size:12.5px;line-height:1;
  padding:3px 4px;border-radius:4px;color:var(--text-3);font-family:inherit;
  transition:background .12s,color .12s;
}
.lt .ico button:hover{background:var(--accent-soft);color:var(--accent)}
.lt .ico button.dg:hover{background:var(--err-soft);color:var(--err)}

.lt .exp-row td{padding:0;border-bottom:1px solid var(--line)}
.lt .exp-in{padding:14px 16px;background:var(--panel-2)}
/* 展开详情里的操作条 */
.lt .dr-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}

/* ================= 账户页 ================= */
.acct{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.acct .acard{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 17px;box-shadow:var(--shadow);
}
.acct .acard h3{
  margin:0 0 11px;font-size:13px;font-weight:650;color:var(--text);
  display:flex;align-items:center;gap:7px;
}
.acct .acard h3 .ico{font-size:15px}
.acct .acard .kv{grid-template-columns:70px 1fr;font-size:12.5px}
.acct .acard .kv dt{color:var(--text-3)}
.acct .acard .kv dd{margin:0;word-break:break-all}
/* 账户头像块 */
.acct .who{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.acct .avatar{
  width:44px;height:44px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,#4a7cf7,#7b5cf0);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;
}
.acct .who .nm{font-size:15px;font-weight:650;color:var(--text)}
.acct .who .sub{font-size:11.5px;color:var(--text-3);margin-top:3px}
/* 入口按钮列表 */
.acct .lnk{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;
  cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s;
}
.acct .lnk:hover{background:var(--accent-soft);border-color:#cfe0ff}
.acct .lnk .i{font-size:15px;flex:none;width:20px;text-align:center}
.acct .lnk .t{font-size:12.5px;font-weight:600;color:var(--text)}
.acct .lnk .h{font-size:11px;color:var(--text-3);margin-top:2px}
.acct .lnk .arrow{margin-left:auto;color:var(--text-3);font-size:12px}
.acct .lnk.dis{opacity:.5;cursor:default}
.acct .lnk.dis:hover{background:none;border-color:transparent}

/* 记忆清单 */
.mem-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
  cursor:pointer;border:1px solid transparent;
}
.mem-item:hover{background:var(--panel-2);border-color:var(--line)}
.mem-item .fi{font-size:14px;flex:none}
.mem-item .mn{font-size:12.5px;color:var(--text);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-item .ms{font-size:11px;color:var(--text-3);flex:none}
.mem-item .go{font-size:11px;color:var(--accent);flex:none;opacity:0}
.mem-item:hover .go{opacity:1}

/* 在线搜索区 */
.ol-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ol-bar .search{flex:1;min-width:220px}
.ol-hint{font-size:12px;color:var(--text-3);line-height:1.7}
.ol-res-count{font-size:12.5px;color:var(--text-2);margin-bottom:9px}
/* 详情里的记忆正文预览 */
.mem-view{
  font-size:12.5px;line-height:1.75;color:var(--text-2);white-space:pre-wrap;
  word-break:break-word;max-height:56vh;overflow:auto;
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
/* 表格工具栏里的复选框 */
.chk{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none;white-space:nowrap}
.chk input{cursor:pointer;margin:0}

/* 面包屑 */
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3);flex-wrap:wrap;margin-bottom:12px}
.crumb b{color:var(--text);font-weight:600}
.crumb .sep{color:var(--line)}
.crumb span.lnk{cursor:pointer;color:var(--accent)}
.crumb span.lnk:hover{text-decoration:underline}

/* 空态 / 提示 */
.empty{text-align:center;padding:60px 20px;color:var(--text-3)}
.empty .big{font-size:36px;margin-bottom:11px;opacity:.32}
.empty .t{font-size:15px;color:var(--text-2);margin-bottom:5px}
.note{
  background:var(--warn-soft);border:1px solid #f5e0bb;border-radius:8px;padding:10px 14px;
  font-size:12.5px;color:var(--warn);margin-bottom:13px;line-height:1.7;
}
.note b{font-weight:650}
.note.info{background:var(--accent-soft);border-color:#cfe0ff;color:#1c4fa8}
/* 黄色提示：用于「这件事你可能会误会」——比 info 醒目，但不至于像报错 */
.note.warn{background:var(--warn-soft);border-color:#f5e0bb;color:var(--warn)}
.note .act{
  display:inline-block;margin:8px 0 0;padding:4px 11px;font-size:12px;cursor:pointer;
  background:#fff;color:var(--warn);border:1px solid #e8cf9f;border-radius:6px;font-family:inherit;
}
.note .act:hover{background:#fffaf0;border-color:#d9b877}

/* 每日签到卡片 —— 放首页最显眼处。只做「入口 + 把话说清楚」，不代签（原因见 data.py 注释） */
.checkin{
  background:linear-gradient(135deg,var(--warn-soft) 0%,#fffaf1 100%);
  border:1px solid #eddcbe;border-radius:var(--radius);padding:14px 16px;margin-bottom:15px;
}
.checkin .ck-h{display:flex;align-items:flex-start;gap:11px;flex-wrap:wrap}
.checkin .ck-ico{font-size:24px;line-height:1.1}
.checkin .ck-t{font-size:14.5px;font-weight:700;color:var(--warn)}
.checkin .ck-s{font-size:12px;color:#8a7047;margin-top:2px}
.checkin .ck-btn{
  margin-left:auto;padding:7px 15px;font-size:12.5px;font-weight:600;font-family:inherit;
  cursor:pointer;background:#c8821a;color:#fff;border:1px solid #b5720f;border-radius:7px;
  white-space:nowrap;
}
.checkin .ck-btn:hover{background:#b5720f}
.checkin .ck-btn.sm{background:#fff;color:var(--warn);border-color:#e0c79a;font-weight:500}
.checkin .ck-btn.sm:hover{background:#fffaf0}
.checkin .ck-steps{margin:12px 0 0;padding:0;list-style:none;display:flex;gap:8px;flex-wrap:wrap}
.checkin .ck-steps li{
  flex:1 1 190px;background:#fff;border:1px solid #f0e2cb;border-radius:7px;
  padding:8px 11px;font-size:12px;color:var(--text-2);line-height:1.55;
}
.checkin .ck-steps li b{color:var(--warn)}
.checkin .ck-steps li .num{
  display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;
  background:var(--warn-soft);color:var(--warn);border-radius:50%;
  font-size:10.5px;font-weight:700;margin-right:5px;
}
.checkin .ck-n{
  margin-top:9px;padding:9px 11px;background:rgba(0,0,0,.025);border-radius:7px;
  font-size:11.5px;color:var(--text-3);line-height:1.65;
}
.checkin .ck-n b{color:var(--text-2)}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:#1f2329;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .2s;z-index:999;box-shadow:0 6px 20px rgba(0,0,0,.2);
  max-width:80vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#12693a}
.toast.err{background:#a3281c}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(16,24,40,.34);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.mask.on{display:flex}
.dlg{background:var(--panel);border-radius:12px;max-width:560px;width:100%;box-shadow:var(--shadow-lg);overflow:hidden;max-height:88vh;display:flex;flex-direction:column}
.dlg-h{padding:15px 20px 12px;font-size:15.5px;font-weight:650;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:9px}
.dlg-h .warnic{color:var(--warn);font-size:17px}
.dlg-b{padding:15px 20px;font-size:13.5px;color:var(--text-2);line-height:1.8;word-break:break-word;overflow-y:auto;flex:1}
.dlg-b .hl{color:var(--accent);font-weight:650;background:var(--accent-soft);padding:1px 6px;border-radius:4px}
.dlg-b .danger-hl{color:var(--err);font-weight:650;background:var(--err-soft);padding:1px 6px;border-radius:4px}
.dlg-b .path{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--panel-2);padding:6px 10px;border-radius:6px;display:block;margin:5px 0;border:1px solid var(--line-2);color:var(--text-2);cursor:pointer;word-break:break-all}
.dlg-b .path:hover{border-color:var(--accent);color:var(--accent)}
.dlg-b input[type=text]{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;
  font-family:inherit;outline:none;margin-top:7px;color:var(--text);
}
.dlg-b input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dlg-b ul{margin:7px 0;padding-left:19px}
.dlg-b li{margin-bottom:3px}
.dlg-b .box{background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:10px 13px;margin:9px 0}
.dlg-f{padding:12px 20px 15px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line-2)}

@media(max-width:900px){
  :root{--side-w:62px}
  .brand .t,.nav-i span.lbl,.nav-i .n,.side-f .btn span{display:none}
  .brand{justify-content:center;padding:15px 8px}
  .nav-i{justify-content:center;padding:10px}
  .art-p{display:none}.rright{display:none}
  .hwrap,main{padding-left:14px;padding-right:14px}
  .kv{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="app">
  <aside>
    <div class="brand">
      <div class="logo">🐉</div>
      <div class="t">WorkBuddy<small>管理中心</small></div>
    </div>
    <nav id="nav">
      <div class="nav-t">管理</div>
      <button class="nav-i on" data-view="overview"><span class="i">📊</span><span class="lbl">总览</span></button>
      <button class="nav-i" data-view="tasks"><span class="i">💬</span><span class="lbl">任务</span><span class="n" id="n-tasks">0</span></button>
      <button class="nav-i" data-view="projects"><span class="i">📁</span><span class="lbl">项目</span><span class="n" id="n-projects">0</span></button>
      <button class="nav-i" data-view="automations"><span class="i">⏰</span><span class="lbl">定时任务</span><span class="n" id="n-autos">0</span></button>
      <div class="nav-t">资源</div>
      <button class="nav-i" data-view="plugins"><span class="i">🧩</span><span class="lbl">扩展</span><span class="n" id="n-plugins">0</span></button>
      <button class="nav-i" data-view="online"><span class="i">🌐</span><span class="lbl">在线技能</span><span class="n" id="n-online"></span></button>
      <button class="nav-i" data-view="library"><span class="i">🗄️</span><span class="lbl">资料库</span></button>
      <button class="nav-i" data-view="trash"><span class="i">🗑️</span><span class="lbl">回收站</span><span class="n" id="n-trash">0</span></button>
      <div class="nav-t">关于</div>
      <button class="nav-i" data-view="account"><span class="i">👤</span><span class="lbl">账户</span></button>
      <button class="nav-i" data-view="settings"><span class="i">⚙️</span><span class="lbl">设置与日志</span></button>
    </nav>
    <div class="side-f">
      <button class="btn" id="btn-about"><span>❓ 使用说明</span></button>
    </div>
  </aside>

  <div class="main">
    <header>
      <div class="hwrap">
        <div class="htop">
          <h1 id="page-t">总览<span class="sub" id="page-s"></span></h1>
          <span id="mode-tag"></span>
          <div class="spacer"></div>
          <button class="btn" id="btn-reload">🔄 刷新数据</button>
        </div>
        <div class="bar" id="bar"></div>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="mask" id="mask">
  <div class="dlg">
    <div class="dlg-h" id="dlg-h"></div>
    <div class="dlg-b" id="dlg-b"></div>
    <div class="dlg-f" id="dlg-f"></div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/null;
const SERVER = (typeof window !== "undefined") && window.__SERVER__ === true;

/* ================= 基础工具 ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

function fmtSize(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(2) + " GB";
}
function fmtNum(n) {
  if (n == null) return "0";
  if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
  if (n >= 1000) return (n / 1000).toFixed(1) + "k";
  return String(n);
}
function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate())
    + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function fmtDay(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}
function relTime(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "刚刚";
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  if (s < 2592000) return Math.floor(s / 86400) + " 天前";
  if (s < 31536000) return Math.floor(s / 2592000) + " 个月前";
  return Math.floor(s / 31536000) + " 年前";
}
function daysSince(iso) {
  if (!iso) return null;
  const d = new Date(iso); if (isNaN(d)) return null;
  return (Date.now() - d.getTime()) / 86400000;
}
function toast(msg, kind) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast on" + (kind ? " " + kind : "");
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = "toast"; }, 2200);
}
function copy(text, okMsg) {
  const done = () => toast(okMsg || "已复制", "ok");
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else fallback();
  function fallback() {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("复制失败", "err"); }
    document.body.removeChild(ta);
  }
}

/* ================= 弹窗系统 ================= */
let dlgOnClose = null;
function dialog(title, bodyHtml, buttons, opts) {
  opts = opts || {};
  $("#dlg-h").innerHTML = (opts.warn ? '<span class="warnic">⚠️</span>' : "") + esc(title);
  $("#dlg-b").innerHTML = bodyHtml;
  const f = $("#dlg-f");
  f.innerHTML = "";
  (buttons || [{ label: "知道了", cls: "btn" }]).forEach(b => {
    const el = document.createElement("button");
    el.className = b.cls || "btn";
    el.innerHTML = esc(b.label);
    el.addEventListener("click", () => {
      if (b.onClick) { const keep = b.onClick(); if (keep === true) return; }
      closeDialog();
    });
    f.appendChild(el);
  });
  $("#mask").classList.add("on");
  if (opts.onOpen) opts.onOpen();
}

/* 安全解析 JSON 响应。
 *
 * 🔴 为什么不能直接 r.json()：服务端出错时返回的不一定是 JSON。
 *   · 路由没注册 → 纯文本 "not found"（404）
 *   · 未捕获异常 → HTML traceback 页
 * 这时候 r.json() 会抛 `SyntaxError: Unexpected token 'o', "not found" is not valid JSON`，
 * 用户看到的是这句天书，根本不知道是「服务端这个接口不存在」。
 * 更坑的是**旧版本服务进程还活着**时就是这个症状：新版页面配旧版后端。
 * 所以统一在这里兜住：非 JSON 就给一句人话 + 提示重启服务。
 */
function parseJson(r) {
  return r.text().then(t => {
    try {
      return JSON.parse(t);
    } catch (e) {
      // 把「服务端没这个接口」翻译成人能看懂的话
      if (r.status === 404) {
        throw new Error("服务端没有这个接口（HTTP 404）。" +
          "多半是管理中心的服务还是旧版本进程，请关掉后重新双击「启动管理中心」再试。");
      }
      if (r.status >= 500) {
        throw new Error("服务端出错了（HTTP " + r.status + "）。" +
          "常见原因是这个接口需要本地服务；若服务在跑，请看服务窗口里的报错。");
      }
      throw new Error("服务端返回的不是 JSON（HTTP " + r.status + "）：" +
        String(t || "").slice(0, 120));
    }
  });
}

/* 带错误兜底的取数：非 2xx 或非 JSON 都变成可读的错误对象 */
function apiJson(path, opts) {
  return fetch(path, opts).then(r =>
    parseJson(r).then(j => {
      if (r.status >= 400 && (!j || j.ok !== false)) {
        return { ok: false, error: "服务端返回 HTTP " + r.status };
      }
      return j;
    })
  );
}

// 取当前视图的筛选条件（第一次访问时自动建一份默认的）。
// 用 getter 而不是直接暴露对象，保证任何地方都拿不到「别的视图」的筛选。
function F() {
  if (!state.filters[state.view]) state.filters[state.view] = blankFilter();

// 「每个视图各一份」—— 改一处胜过改八十处。
FILTER_KEYS.forEach(k => {
  Object.defineProperty(state, k, {
    get() { return F()[k]; },
    set(v) { F()[k] = v; },
    enumerable: true,
  });
});

function isStale(t, days) {
  const d = daysSince(t.updated_at || t.created_at);
  return d == null ? false : d > days;
}
function matchTask(t) {
  // 回收站模式只看已删，其它视图默认隐藏已删
  if (state.view === "trash") { if (!t.deleted) return false; }
  else if (t.deleted) return false;

  if (state.quick === "no-art" && (t.artifacts || []).length) return false;
  if (state.quick === "stale" && !isStale(t, 30)) return false;
  if (state.quick === "recent") { const d = daysSince(t.updated_at || t.created_at); if (d == null || d > 7) return false; }
  if (state.quick === "lost" && !(t.artifacts || []).some(a => a.exists === false)) return false;

  const q = state.q.toLowerCase();
  if (q) {
    const hay = [t.title, t.auto_title, t.ai_title, t.cwd, t.prompt, t.expert_id, t.model,
      (t.artifacts || []).map(a => (a.name || "") + " " + (a.path || "")).join(" "),
      (t.todos || []).map(x => x.content).join(" ")
    ].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  if (state.status && t.status !== state.status) return false;
  if (state.mode && t.mode !== state.mode) return false;
  if (state.kind === "art" && !(t.artifacts || []).length) return false;
  if (state.kind === "expert" && !t.expert_id) return false;
  if (state.kind === "auto" && !t.is_automation) return false;
  if (state.time) {
    const days = parseInt(state.time, 10);
    const ref = t.updated_at || t.created_at;
    if (!ref) return false;
    if ((Date.now() - new Date(ref).getTime()) / 86400000 > days) return false;
  }
  return true;
}
function sortTasks(arr) {
  const s = state.sort;
  const key = t => {
    if (s === "created") return t.created_at || "";
    if (s === "name") return t.title || "";
    if (s === "arts") return String((t.artifacts || []).length).padStart(6, "0");
    if (s === "credits") return String(((t.usage || {}).credits_total || 0)).padStart(12, "0");
    if (s === "oldest") return t.updated_at || "";
    return t.updated_at || "";
  };
  const dir = (s === "name" || s === "oldest") ? 1 : -1;
  return arr.slice().sort((a, b) => {
    const ka = key(a), kb = key(b);
    return ka < kb ? -dir : ka > kb ? dir : 0;
  });
}

/* ================= 扩展页的筛选与排序 ================= */

const KIND_LABEL = {
  skill: "技能", expert: "专家", team: "专家团",
  connector: "连接器", plugin: "内置功能",
};
// 「按类型排序」用业务顺序，不用字母序。
// 字母序会排成 连接器→专家→内置功能→技能→专家团（connector < expert < …），
// 既不是明哥列举的顺序，也不符合「先看自己装的技能、再看专家」的直觉。
const KIND_ORDER = { skill: 1, expert: 2, team: 3, connector: 4, plugin: 5 };
const KIND_BADGE = {
  skill: "b-mode", expert: "b-run", team: "b-auto",
  connector: "b-done", plugin: "b-mode",
};

// 来源归成四大类：细分的 marketplace（专家市场/官方市场/团队市场…）有 11 种，
// 直接做下拉会太长；人真正想问的是「这是自带的、我自己装的、还是市场下的」。
function plugSrcGroup(p) {
  if (p.marketplace === "mcp") return "mcp";
  if (p.marketplace === "local" || p.source === "本地目录") return "local";
  if (p.marketplace === "workbuddy-builtin") return "builtin";
  return "market";
}
const SRC_LABEL = {
  builtin: "内置", local: "本地", market: "市场", mcp: "MCP 配置",
};

function matchPlugin(p) {
  if (state.plugInstalled === "yes" && !p.installed) return false;
  if (state.plugInstalled === "no" && p.installed) return false;
  if (state.plugKind && p.kind !== state.plugKind) return false;
  if (state.plugSource && plugSrcGroup(p) !== state.plugSource) return false;

  const q = state.q.toLowerCase();
  if (q) {
    const hay = [p.name, p.desc, p.author, p.version, p.path, p.source,
      p.marketplace, (p.keywords || []).join(" "), p.id
    ].join(" ").toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function sortPlugins(arr) {
  const s = state.sort;
  // 只在值真的不同时才比，避免「相等却返回非 0」导致排序不稳定
  const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
  const key = p => {
    if (s === "pkind") {
      const o = KIND_ORDER[p.kind] || 9;
      return "0" + o + " " + (p.name || "").toLowerCase();
    }
    if (s === "psrc") return plugSrcGroup(p) + " " + (p.name || "").toLowerCase();
    if (s === "pupdated") return p.updated_at || "";
    if (s === "pinst") return p.installed_at || p.updated_at || "";
    return (p.name || "").toLowerCase();
  };
  // 时间类倒序（最近的在前），其余升序
  const desc = (s === "pupdated" || s === "pinst");
  return arr.slice().sort((a, b) => {
    const ka = key(a), kb = key(b);
    // 没有时间的排最后，而不是混在最前面（默认按名称时不受影响）
    if (desc && !ka !== !kb) return ka ? -1 : 1;
    return desc ? -cmp(ka, kb) : cmp(ka, kb);
  });
}

    h += '<select id="f-pkind"><option value="">全部类型</option>' +
      [['skill', '技能'], ['expert', '专家'], ['team', '专家团'],
       ['connector', '连接器'], ['plugin', '内置功能']].map(x =>
        '<option value="' + x[0] + '">' + x[1] + "</option>").join("") + "</select>";
    h += '<select id="f-psrc"><option value="">全部来源</option>' +
      [['builtin', '内置'], ['local', '本地（自己装的）'], ['market', '市场装的'],
       ['mcp', 'MCP 配置']].map(x =>
        '<option value="' + x[0] + '">' + x[1] + "</option>").join("") + "</select>";
    h += '<select id="f-pinst">' +
      [['yes', '只看已安装'], ['no', '只看货架上的'], ['all', '全部']].map(x =>
        '<option value="' + x[0] + '"' +
        (state.plugInstalled === x[0] ? " selected" : "") + ">" + x[1] + "</option>").join("") + "</select>";
    // 生成时就标 selected：syncBar() 只在「值不一样」时才写，
    // 而它默认值恰好也是第一项，写不写都一个样 —— 一旦哪次时序有偏差
    // 就会出现「下拉是空的」。服务端渲染阶段就把选中项定死最稳。
    h += '<select id="sort">' +
      [['pname', '名称'], ['pkind', '类型'], ['psrc', '来源'],
       ['pupdated', '最近更新'], ['pinst', '安装时间']].map(x =>
        '<option value="' + x[0] + '"' + (state.sort === x[0] ? " selected" : "") + ">" +
        x[1] + "</option>").join("") + "</select>";
    h += '<button class="btn" id="btn-clear">清空筛选</button>';
  } else if (state.view === "online") {
    h += '<div class="search"><input id="ol-qbar" type="text" ' +
      'placeholder="搜在线技能（回车即可）…" autocomplete="off" spellcheck="false"></div>';
    h += '<button class="btn primary" id="ol-gobar">🔍 搜索</button>';
    h += '<button class="btn" id="ol-reset">清空结果</button>';
  } else if (state.view === "library") {
    // 只有在浏览某个目录时「过滤文件名」才有意义；首页是页签+卡片，没有列表可筛。
    if (state.libPath) {
      h += '<div class="search"><input id="q" type="text" placeholder="在当前目录中过滤文件名…" autocomplete="off" spellcheck="false"></div>';
      h += '<button class="btn" id="lib-home">返回资料库首页</button>';
    }
  } else if (state.view === "account") {
    h += '<button class="btn" id="acct-reload">🔄 重新读取</button>';
    h += '<button class="btn" id="acct-open">📂 打开数据目录</button>';
  } else if (state.view === "settings") {
    h += '<button class="btn" id="btn-bak">立即备份数据库</button>';
    h += '<button class="btn" id="btn-log">查看操作日志</button>';
  }
  bar.innerHTML = h;

  // 输入框：**只更新数据，不重新渲染工具条**。
  //
  // 这里刻意调 render() 而不是 renderChrome()：render() 里的 buildBar()
  // 会因为「视图没变」而直接返回，DOM 不动，所以光标和输入法都安然无恙。
  // 早前这里走的是 render() → renderChrome() → bar.innerHTML = h，
  // 等于每敲一个字就把输入框删了重建 —— 就是打不了字的元凶。
  if ($("#q")) {
    $("#q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
  }
  const lh = $("#lib-home");
  if (lh) lh.addEventListener("click", () => {
    state.libPath = ""; state.q = ""; window.__LIB_CACHE__ = null; render();
  });
  const bind = (id, key) => {
    const el = $("#" + id);
    if (el) el.addEventListener("change", e => { state[key] = e.target.value; renderList(); });
  };
  bind("f-status", "status"); bind("f-mode", "mode"); bind("f-kind", "kind");
  bind("f-time", "time"); bind("sort", "sort");
  bind("f-proj", "projScope"); bind("f-auto", "autoScope");
  bind("f-pkind", "plugKind"); bind("f-psrc", "plugSource");
  bind("f-pinst", "plugInstalled");

  const cb = $("#f-cards");
  if (cb) cb.addEventListener("change", e => { state.cards = e.target.checked; renderList(); });

  const bcl = $("#btn-clear");
  if (bcl) bcl.addEventListener("click", () => {
    const f = F();
    // 逐个重置成默认值，而不是换一个新对象 —— state 上的 getter 指向的是
    // F() 返回的那个对象，整份替换会让 getter 指到旧对象上去。
    Object.assign(f, blankFilter());
    buildBar(true);
    renderList();
  });
  const bb = $("#btn-bak");
  if (bb) bb.addEventListener("click", doBackup);
  const bl = $("#btn-log");
  if (bl) bl.addEventListener("click", doShowLog);

  // ---- 在线技能工具条 ----
  const og = $("#ol-gobar");
  const oq = $("#ol-qbar");
  if (og) og.addEventListener("click", runOnlineSearch);
  if (oq) oq.addEventListener("keydown", e => { if (e.key === "Enter") runOnlineSearch(); });
  const ors = $("#ol-reset");
  if (ors) ors.addEventListener("click", () => {
    OL.results = null; OL.err = ""; OL.q = "";
    const iq = $("#ol-qbar"); if (iq) iq.value = "";
    renderList();
  });

  // ---- 账户工具条 ----
  const ar = $("#acct-reload");
  if (ar) ar.addEventListener("click", () => { ACCT.data = null; ACCT.err = ""; loadAccount(); });
  const ao = $("#acct-open");
  if (ao) ao.addEventListener("click", () => {
    const d = (ACCT.data || {}).client || {};
    if (d.data_dir) revealPath(d.data_dir);
    else toast("数据目录未知", "err");
  });
}

// 把 state 里的筛选值同步到已经存在的控件上（不新建 DOM）。
function syncBar() {
  const q = $("#q");
  // 只在值真的不一样时才写，否则会打断正在进行的输入法组字。
  if (q && q.value !== state.q) q.value = state.q;
  const set = (id, v) => { const el = $("#" + id); if (el && el.value !== v) el.value = v; };
  set("f-status", state.status); set("f-mode", state.mode); set("f-kind", state.kind);
  set("f-time", state.time); set("sort", state.sort);
  set("f-proj", state.projScope); set("f-auto", state.autoScope);
  set("f-pkind", state.plugKind); set("f-psrc", state.plugSource);
  set("f-pinst", state.plugInstalled);
  const cb = $("#f-cards");
  if (cb && cb.checked !== !!state.cards) cb.checked = !!state.cards;
}

function renderChrome() {
  renderHeader();
  renderSidebar();
  buildBar(false);
  syncBar();
}

/* 可点击的统计卡片 */

    (opts.quick && state.quick === opts.quick) ? "on" : ""].filter(Boolean).join(" ");

  return '<div class="' + cls + '"' + attrs + ' title="' + esc(opts.tip || desc || "") + '">' +

}

/* ================= 列宽（手动调整 + 持久化） =================
   //
   // 明哥的要求：所有列头都能手动拖宽窄。
   //
   // 关键实现点：
   //   1. 用 <colgroup><col> 承载宽度，而不是给每个 th/td 写 style ——
   //      col 是「整列的宽度定义」，浏览器会把同列所有单元格一起改，
   //      不用在展开/收起时重算每一格。
   //   2. 宽度存 localStorage，**按视图分开存**（任务页拖窄了「目录」，
   //      不该影响扩展页）。存的是像素，但要能适应窗口变化，所以
   //      拖动结束后按「当前表格总宽」换算成百分比再存 ——
   //      存像素的话，换个分辨率打开会把最后一列挤没。
   //   3. 双击手柄 = 恢复该列默认宽度；表头右键 = 全部恢复。
*/
const COLW_KEY = "wb-colw-v1";

// 拖完列宽会紧接着触发一次 click（mouseup 之后的那个）。如果不吞掉，
// 这一下会被 th[data-sortkey] 当成「点表头排序」——用户只是想拖宽一点，
// 结果列表顺序变了。用一次性标记把它吃掉，比给每个 th 加 lock 类干净。
let SUPPRESS_CLICK = false;

function loadColWidths() {
  try {
    const raw = localStorage.getItem(COLW_KEY);
    return raw ? (JSON.parse(raw) || {}) : {};
  } catch (e) { return {}; }
}
function saveColWidths(all) {
  try { localStorage.setItem(COLW_KEY, JSON.stringify(all)); } catch (e) { /* 隐私模式等 */ }
}
// 当前视图 -> {列 key: 百分比}
function colWidthsFor(view) {
  const all = loadColWidths();
  return all[view] || null;
}
function setColWidth(view, key, pct) {
  const all = loadColWidths();
  if (!all[view]) all[view] = {};
  all[view][key] = Math.round(pct * 1000) / 1000;
  saveColWidths(all);
}
function clearColWidths(view) {
  const all = loadColWidths();
  delete all[view];
  saveColWidths(all);
}

// 把宽度渲染成 <colgroup>。没设过的列走 CSS 里的默认百分比。
function colsHtml(view, cols) {
  const w = colWidthsFor(view);
  if (!w) return "";
  let h = "<colgroup>";
  cols.forEach(c => {
    const p = w[c[0]];
    h += "<col" + (p ? ' style="width:' + p + '%"' : "") + ">";
  });
  return h + "</colgroup>";
}

function hasCustomCols(view) { return !!colWidthsFor(view); }

/* 表头单元格：标签 + 排序箭头 + 拖拽手柄 */
function thHtml(view, c) {
  const [k, label, srt, cls] = c;
  return '<th class="' + cls + (srt ? " srt" : "") +
    (srt && state.sort === srt ? " on" : "") + '"' +
    (srt ? ' data-sortkey="' + srt + '" title="点一下按' + esc(label) + '排序"' : "") +
    ' data-colkey="' + k + '">' +
    esc(label) + (srt ? sortArrow(srt) : "") +
    '<span class="rsz" data-rzcol="' + k + '" data-rzview="' + esc(view) +
    '" title="拖动调整列宽 · 双击恢复本列默认"></span></th>';
}

/* 拖动列宽。mousedown 在手柄上时接管，直到松开。 */
function startColResize(e, handle) {
  const th = handle.closest("th");
  const table = handle.closest("table");
  if (!th || !table) return;
  const view = handle.dataset.rzview || state.view;
  const key = handle.dataset.rzcol;
  e.preventDefault();
  e.stopPropagation();

  const cols = Array.from(table.querySelectorAll("colgroup > col"));
  const ths = Array.from(table.querySelectorAll("thead > tr > th"));
  const idx = ths.indexOf(th);
  if (idx < 0) return;

  // 表格当前总宽（用来把像素换算成百分比）
  const totalW = table.getBoundingClientRect().width || 1;
  const startX = e.clientX;
  const startW = th.getBoundingClientRect().width;
  const MIN = 44;                        // 再窄就只剩省略号了

  // 没有 colgroup 时现造一个：把当前每列实际宽度写进去当起点，
  // 这样拖一根不会让其它列突然跳回 CSS 默认值。
  if (!cols.length) {
    const cg = document.createElement("colgroup");
    ths.forEach(t => {
      const c = document.createElement("col");
      c.style.width = t.getBoundingClientRect().width + "px";
      cg.appendChild(c);
    });
    table.insertBefore(cg, table.firstChild);
  }
  const colEls = Array.from(table.querySelectorAll("colgroup > col"));
  const col = colEls[idx];
  if (!col) return;

  handle.classList.add("on");
  document.body.classList.add("col-resizing");
  // 拖拽期间固定列宽语义：table-layout:fixed 才不会因为内容宽度又弹回去
  table.classList.add("fixed");

  const others = colEls.filter((_, i) => i !== idx);
  const othersW = others.reduce((s, c) => s + c.getBoundingClientRect().width, 0);

  function onMove(ev) {
    let w = startW + (ev.clientX - startX);
    w = Math.max(MIN, w);
    // 不许把其它列挤到 0：至少给每列留 MIN
    if (othersW > 0 && w > totalW - MIN * others.length) {
      w = Math.max(MIN, totalW - MIN * others.length);
    }
    col.style.width = w + "px";
    handle.dataset.lastw = String(w);
  }
  function onUp() {
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    handle.classList.remove("on");
    document.body.classList.remove("col-resizing");
    // 落盘：像素 -> 百分比（存像素换分辨率就崩）
    const w = parseFloat(handle.dataset.lastw || "0");
    if (w > 0) {
      const tw = table.getBoundingClientRect().width || totalW;
      // 只在真的拖了才存（点一下不算）
      if (Math.abs(w - startW) > 1) {
        setColWidth(view, key, (w / tw) * 100);
        SUPPRESS_CLICK = true;   // 吞掉紧接着那一下 click
      }
    }
    delete handle.dataset.lastw;
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}

/* 表格渲染完后，把存下来的宽度应用上去。
   为什么不在生成 HTML 时一次写完：因为 -1 列（自动宽度）需要
   先让浏览器算一次才拿得到像素值。 */
function applyColWidths() {
  $$("table.lt").forEach(tb => {
    if (tb.querySelector("colgroup > col")) tb.classList.add("fixed");
  });
}

// 恢复某个视图的所有列宽

}


//
// 两种形态：
//   · 表格（默认）— 带表头，一屏能看几十条，列头可点排序、可拖列宽
//   · 卡片（勾「卡片视图」）— 原来的样子，信息密度低但一眼看得清状态
// 两种形态共用 renderTaskDetail()，所以展开后看到的内容完全一致。
//
// ⚠️ 这里**没有「操作」列**了（明哥要求取消）。
// 删除 / 恢复 / 展开这些动作全部收进「点行展开」之后的详情里 ——
// 列表只管看，动作在展开区里做，误点风险小得多。
const TASK_COLS = [
  // key       表头          排序字段（空=不可排序）  列宽类
  ["name",    "任务名",      "name",     "c-name"],
  ["cwd",     "目录",        "",         "c-cwd"],
  ["created", "创建时间",    "created",  "c-created"],
  ["updated", "最近更新",    "updated",  "c-updated"],
  ["auto",    "自动标题",    "",         "c-auto"],
  ["mode",    "模式",        "",         "c-mode"],
  ["model",   "模型",        "",         "c-model"],
  ["jsonl",   "对话记录",    "",         "c-path"],
  ["title",   "标题（手动）", "name",     "c-title"],
];
function sortArrow(key) {
  if (!key || state.sort !== key) return '<span class="ar">↕</span>';
  // 名称/最久未动是升序，其余降序 —— 和 sortTasks() 里的 dir 保持一致
  return '<span class="ar">' + ((key === "name" || key === "oldest") ? "↑" : "↓") + "</span>";
}

function renderTaskTable(list) {
  const view = state.view;
  let h = '<div class="lt-wrap"><table class="lt' +
    (hasCustomCols(view) ? " fixed" : "") + '">';
  h += colsHtml(view, TASK_COLS);
  h += "<thead><tr>";
  TASK_COLS.forEach(c => { h += thHtml(view, c); });
  h += "</tr></thead><tbody>";
  list.forEach(t => {
    const open = openSet.has(t.id);
    const arts = t.artifacts || [];
    const nArt = arts.length;
    const lost = arts.filter(a => a.exists === false).length;
    const hasCustom = !!t.custom_title;
    const rowCls = (open ? "open" : "") + (t.deleted ? " is-del" : "");

    // 整行可点（data-row）：点任何非交互位置 = 展开/收起详情。
    // 标题上挂 data-reopen（打开任务）、铅笔挂 data-edit（改名），
    // 这两个是行内的例外，靠 data-* 优先级在事件委托里拦下来。
    h += '<tr class="' + rowCls.trim() + '" data-id="' + esc(t.id) +
      '" data-row="' + esc(t.id) + '" title="' +
      (open ? "点击收起详情" : "点击展开详情") + '">';

    // 任务名：点名称 = 打开任务（**不是编辑**）。
    // 改名统一走「标题（手动）」列的小铅笔 ——
    // 明哥的反馈：点哪都能编太容易误操作，改成必须点图标才进编辑态。
    h += '<td class="c-name">';
    h += '<span class="ename' + (hasCustom ? "" : " unnamed") + '" data-reopen="' + esc(t.id) + '" ' +
      'title="' + esc(t.title) + "（点击唤起 WorkBuddy 打开）" + '">' + esc(t.title) + "</span>";
    let bg = statusBadge(t.status);
    if (t.deleted) bg += '<span class="badge b-del">已删除</span>';
    if (lost) bg += '<span class="badge b-lost">' + lost + " 丢失</span>";
    if (nArt) bg += '<span class="badge b-mode">' + nArt + " 产物</span>";
    if (bg) h += '<span class="rbadges">' + bg + "</span>";
    h += "</td>";

    h += '<td class="c-cwd"><span class="ell mono" title="' + esc(t.cwd || "") + '">' +
      esc(t.cwd || "—") + "</span></td>";
    h += '<td class="c-created nowrap">' + fmtTime(t.created_at) + "</td>";
    h += '<td class="c-updated"' + ' title="' + esc(t.updated_at || "") + '">' +
      '<span class="ell">' + fmtTime(t.updated_at || t.created_at) + "</span>" +
      '<span class="sub2">' + relTime(t.updated_at || t.created_at) + "</span></td>";
    h += '<td class="c-auto"><span class="ell" title="' + esc(t.auto_title || "") + '">' +
      esc(t.auto_title || "—") + "</span></td>";
    h += '<td class="c-mode nowrap">' + (modeBadge(t.mode) || '<span style="color:var(--text-3)">—</span>') + "</td>";
    h += '<td class="c-model"><span class="ell mono" title="' + esc(t.model || "") + '">' +
      esc(t.model || "—") + "</span></td>";
    // 「对话记录」列显示什么？
    // jsonl_path 里最后一段是会话 UUID（形如 bbfd7527-6c11-…），
    // 对人不构成任何信息 —— 直接摆出来等于白占一列。真正有用的是
    // 「有没有对话记录」以及「有多少条消息」。所以这列给消息条数，
    // 完整路径放到 title 里（鼠标悬停可见 / 详情里也能看到全文）。
    h += '<td class="c-path">';
    if (t.jsonl_path) {
      h += '<span class="ell" title="' + esc(t.jsonl_path) + '">' +
        (t.message_count ? t.message_count + " 条消息" : "有记录") + "</span>";
    } else {
      h += '<span style="color:var(--text-3)">无</span>';
    }
    h += "</td>";

    // 「标题（手动）」列 —— 文字本身不可编辑，右侧小铅笔才进编辑态。
    // 这样「想看看标题」和「想改标题」是两件不会互相误触的事。
    h += '<td class="c-title"><span class="tc">';
    h += '<span class="ename' + (hasCustom ? "" : " unnamed") + '" title="' +
      esc(hasCustom ? t.custom_title : "（未设置，点铅笔填写）") + '">' +
      esc(hasCustom ? t.custom_title : "（未设置）") + "</span>";
    if (!t.deleted) {
      h += '<button class="pencil" data-edit="' + esc(t.id) +
        '" title="修改标题（留空则恢复自动标题）">✎</button>';
    }
    h += "</span></td></tr>";

    // 展开行：把原来卡片里的详情整块搬进来
    if (open) {
      h += '<tr class="exp-row"><td colspan="' + TASK_COLS.length + '">' +
        '<div class="exp-in">' + renderTaskDetail(t) + "</div></td></tr>";
    }
  });
  h += "</tbody></table></div>";
  return h;
}

function renderTasks() {
  const all = DATA.tasks || [];
  const filtered = sortTasks(all.filter(matchTask));
  if (!filtered.length) {
    return '<div class="empty"><div class="big">🔍</div><div class="t">' +
      (state.view === "trash" ? "回收站是空的" : "没有匹配的任务") + "</div>" +
      "<div>试试放宽筛选条件，或清空搜索关键词</div></div>";
  }
  const total = (all || []).filter(t => state.view === "trash" ? t.deleted : !t.deleted).length;
  let h = '<div class="tools"><span>显示 ' + filtered.length + " / " + total + " 个任务</span>";
  if (state.quick) {
    const lbl = { "no-art": "无人问津", stale: "30 天未动", recent: "近 7 天活跃", lost: "产物丢失" }[state.quick] || state.quick;
    h += '<span class="badge b-run">已筛选：' + esc(lbl) + "</span>";
  }
  h += '<span style="margin-left:auto;font-size:11.5px">点标题打开任务 · 点 ✎ 改标题 · 点 ▼ 看详情</span>';
  h += "</div>";

  if (state.cards) {
    h += '<div class="rows">' + filtered.map(renderRow).join("") + "</div>";
  } else {
    h += renderTaskTable(filtered);
  }
  return h;
}

const PLUG_COLS = [
  // key      表头        排序字段      列宽类
  ["name",    "名称",     "pname",      "c-pname"],
  ["kind",    "类型",     "pkind",      "c-pkind"],
  ["source",  "来源",     "psrc",       "c-psrc"],
  ["desc",    "说明",     "",           "c-pdesc"],
  ["version", "版本",     "",           "c-pver"],
  ["author",  "作者",     "",           "c-pauth"],
  ["updated", "更新时间", "pupdated",   "c-pupd"],
  ["status",  "状态",     "pinst",      "c-pstat"],
];

function renderPlugins() {
  const all = DATA.plugins || [];
  const filtered = sortPlugins(all.filter(matchPlugin));
  if (!filtered.length) {
    return '<div class="empty"><div class="big">🔍</div><div class="t">没有匹配的扩展</div>' +
      "<div>试试放宽筛选条件，或清空搜索关键词</div></div>";
  }
  const total = all.length;
  const nInst = all.filter(p => p.installed).length;

  let h = '<div class="tools"><span>显示 ' + filtered.length + " / " + total +
    " 个（其中已安装 " + nInst + "）</span>";
  if (state.plugInstalled === "yes") {
    h += '<span class="badge b-run">只看已安装</span>';
  } else if (state.plugInstalled === "no") {
    h += '<span class="badge b-warn">只看市场货架（未安装）</span>';
  }
  h += '<span style="margin-left:auto;font-size:11.5px">点行展开详情 · 拖表头右缘调列宽</span>';
  h += "</div>";

  const view = "plugins";
  h += '<div class="lt-wrap"><table class="lt' +
    (hasCustomCols(view) ? " fixed" : "") + '">';
  h += colsHtml(view, PLUG_COLS);
  h += "<thead><tr>";
  PLUG_COLS.forEach(c => { h += thHtml(view, c); });
  h += "</tr></thead><tbody>";

  filtered.forEach(p => {
    const open = openSet.has(p.id);
    h += '<tr class="' + (open ? "open" : "") + (p.missing ? " is-del" : "") + '" data-id="' +
      esc(p.id) + '" data-row="' + esc(p.id) + '" title="' +
      (open ? "点击收起详情" : "点击展开详情") + '">';

    // 名称列：主显中文展示名，副显标识 ——
    // 明哥的反馈：「只看 slug 看不太懂是什么技能」。所以中文名放前面、
    // 加粗；标识缩到下面一行小字（排查问题、复制命令时还要用到它）。
    //
    // 🔴 两行都写同一个词的情况要躲开：像官方 github 连接器，它自己
    // plugin.json 里的 name 就是 "github"，这时 display_name 和 name 一模一样，
    // 主显「github」、副显「github」，看起来像渲染坏了。
    // 判据是 **display_name 和 name 不同**才显示副标题，不是「有没有 display_name」。
    const disp = p.display_name || "";
    const dup = !disp || disp === p.name;     // 名字和标识重合，副标题没意义
    const primary = disp || p.name;
    h += '<td class="c-pname"><span class="ell" title="' + esc(primary) +
      (disp && !dup ? "（" + esc(p.name) + "）" : "") + '"><b>' + esc(primary) + "</b></span>";
    if (!dup) {
      h += '<span class="sub2 mono">' + esc(p.name) + "</span>";
    } else if (p.kind_note) {
      // 名字重合时改用类型说明（「11 个角色」这种）填那行，别留白
      h += '<span class="sub2">' + esc(p.kind_note) + "</span>";
    }
    h += "</td>";

    h += '<td class="c-pkind"><span class="badge ' + (KIND_BADGE[p.kind] || "b-mode") + '">' +
      esc(KIND_LABEL[p.kind] || p.kind) + "</span></td>";

    h += '<td class="c-psrc"><span class="ell" title="' + esc(p.source) + '">' +
      esc(SRC_LABEL[plugSrcGroup(p)] || p.source) + "</span>";
    if (p.marketplace && p.marketplace !== "local" && p.marketplace !== "mcp") {
      h += '<span class="sub2">' + esc(p.marketplace) + "</span>";
    }
    h += "</td>";

    h += '<td class="c-pdesc"><span class="ell" title="' + esc(p.desc || "") + '">' +
      (p.desc ? esc(p.desc) : '<span style="color:var(--text-3)">—</span>') + "</span></td>";

    h += '<td class="c-pver"><span class="ell mono" title="' + esc(p.version || "") + '">' +
      (p.version ? esc(p.version) : '<span style="color:var(--text-3)">—</span>') + "</span></td>";

    h += '<td class="c-pauth"><span class="ell" title="' + esc(p.author || "") + '">' +
      (p.author ? esc(p.author) : '<span style="color:var(--text-3)">—</span>') + "</span></td>";

    h += '<td class="c-pupd nowrap">' + (p.updated_at ? fmtTime(p.updated_at)
      : '<span style="color:var(--text-3)">—</span>') + "</td>";

    // 状态列：没装的要一眼看出来，否则「我装了 95 个」这句话会被误读
    h += '<td class="c-pstat">' + (p.installed
      ? '<span class="badge b-done">已安装</span>'
      : '<span class="badge b-mode">未安装</span>') +
      (p.enabled === false ? '<span class="badge b-err">已停用</span>' : "") + "</td></tr>";

    if (open) {
      h += '<tr class="exp-row"><td colspan="' + PLUG_COLS.length + '">' +
        '<div class="exp-in">' + renderPluginDetail(p) + "</div></td></tr>";
    }
  });
  h += "</tbody></table></div>";
  return h;
}

    return h + '<div class="note"><b>搜索失败：</b>' + esc(OL.err) +
      '<br>内网环境可能访问不了公网接口。' +
      '可以改用官方技能市场（客户端左侧「技能」），或检查网络后重试。</div>';
  }
  if (!OL.results) {
    return h + '<div class="empty"><div class="big">🌐</div>' +
      '<div class="t">输入关键词后点「搜索在线技能」</div>' +
      "<div>只搜公开接口，不会上传你自己的任何数据</div></div>";
  }
  if (!OL.results.length) {
    return h + '<div class="empty"><div class="big">🔍</div><div class="t">没有搜到「' +
      esc(OL.q) + "」相关的技能</div><div>换个关键词试试，比如用功能词而不是技能名</div></div>";
  }

  const inst = DATA.plugins || [];
  const localNames = new Set();
  inst.forEach(p => {
    localNames.add((p.name || "").toLowerCase());
    if (p.display_name) localNames.add(p.display_name.toLowerCase());
  });

  h += '<div class="ol-res-count">搜到 <b>' + OL.results.length + "</b> 个技能（按相关度排序）</div>";
  h += '<div class="lt-wrap"><table class="lt fixed">';
  h += "<thead><tr>";
  ONLINE_COLS.forEach(c => {
    h += '<th class="' + c[3] + '">' + esc(c[1]) + "</th>";
  });
  h += "</tr></thead><tbody>";

  OL.results.forEach(it => {
    const key = it.slug;
    // 「已装」有两条判据：接口回的 slug 在本机目录里，或名字对得上。
    // 只用一条会漏 —— 有的是从市场装的，目录名和 slug 不一样。
    const isInst = !!it.installed ||
      localNames.has((it.display_name || "").toLowerCase()) ||
      localNames.has((it.name || "").toLowerCase());
    const busy = OL.installing === key;

    h += "<tr>";
    h += '<td class="c-oname"><span class="ell" title="' + esc(it.display_name) + '"><b>' +
      esc(it.display_name) + "</b></span>" +
      '<span class="sub2 mono">' + esc(it.slug) + "</span></td>";
    h += '<td class="c-oauthor"><span class="ell" title="' + esc(it.author) + '">' +
      (it.author ? esc(it.author) : '<span style="color:var(--text-3)">—</span>') + "</span>";
    if (it.namespace) h += '<span class="sub2">@' + esc(it.namespace) + "</span>";
    h += "</td>";
    h += '<td class="c-odesc"><span class="ell" title="' + esc(it.desc) + '">' +
      (it.desc ? esc(it.desc) : '<span style="color:var(--text-3)">（无说明）</span>') + "</span></td>";
    h += '<td class="c-over"><span class="ell mono">' + (it.version ? esc(it.version)
      : '<span style="color:var(--text-3)">—</span>') + "</span></td>";
    h += '<td class="c-odl nowrap">' + fmtNum(it.downloads) +
      (it.stars ? ' <span style="color:var(--text-3)">★' + it.stars + "</span>" : "") + "</td>";
    h += '<td class="c-ostat">';
    if (isInst) {
      h += '<span class="badge b-done">已安装</span>';
    } else if (busy) {
      h += '<span class="badge b-run">安装中…</span>';
    } else {
      h += '<button class="act" data-oin="' + esc(key) + '" data-ons="' +
        esc(it.namespace) + '" title="装到技能目录">⬇ 安装</button>';
    }
    if (it.needs_key) h += '<span class="badge b-warn" title="需要自己配 API Key">需 Key</span>';
    h += "</td></tr>";
  });
  h += "</tbody></table></div>";

  h += '<div class="ol-hint" style="margin-top:12px">' +
    "· 安装前会先下载到临时目录校验，确认结构无误才落位 —— 失败不会留下半个技能。<br>" +
    "· 装完可能需要<b>重启 WorkBuddy</b> 才会在技能列表里出现。<br>" +
    "· 这里只做「装」，不做安全审查。第三方技能的完整审查流程见 <b>ym-skillhub</b> 技能。</div>";
  return h;
}

/* 在线搜索：发起请求 */
function runOnlineSearch() {
  if (!SERVER) { showStaticHint(); return; }
  const q = (OL.q || "").trim();
  if (!q) { toast("先输入关键词", "err"); return; }
  OL.loading = true; OL.err = ""; OL.results = null;
  renderList();
  fetch("/api/online/search?q=" + encodeURIComponent(q))
    .then(parseJson)
    .then(j => {
      OL.loading = false;
      if (j.ok) { OL.results = j.results || []; }
      else { OL.err = j.error || "未知错误"; }
      renderList();
    })
    .catch(err => {
      OL.loading = false;
      OL.err = String(err && err.message || err);
      renderList();
    });
}

/* 在线安装：默认不覆盖；已存在时弹二次确认 */
function doOnlineInstall(slug, ns, overwrite) {
  if (!SERVER) { showStaticHint(); return; }
  if (!slug) return;

  // 走一遍 `[data-oin]` 那一套已经算出来的「已装」判据，避免用户对着
  // 「已安装」的徽标又点了一次（这种情况只可能出现在没有 installed 标记的回包里）。
  if (!overwrite) {
    const hit = (DATA.plugins || []).some(p => (p.name || "") === slug ||
      (p.display_name || "") === slug);
    if (hit) {
      dialog("这个技能已经装过了", [
        "本机技能目录里已经有一个「" + slug + "」。",
        "继续安装会用线上版本替换掉它，并先把它备份成 <span class='mono'>.bak-&lt;时间戳&gt;</span>。",
        "<p style='margin:8px 0 0;color:var(--text-3);font-size:12.5px'>" +
        "如果你手工改过这个技能，改的内容会停留在备份里，不再生效。</p>"
      ].join("\n"), [
        { label: "取消", ghost: true },
        { label: "覆盖安装", danger: true, fn: () => doOnlineInstall(slug, ns, true) }
      ]);
      return;
    }
  }

  OL.installing = slug;
  renderList();
  fetch("/api/online/install", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ slug: slug, namespace: ns || "", overwrite: !!overwrite })
  })
    .then(parseJson)
    .then(j => {
      OL.installing = "";
      if (j.ok) {
        toast("已安装「" + (j.name || slug) + "」" + (j.backup ? "（旧的已备份）" : ""), "ok");
        if (j.restart_hint) setTimeout(() => toast(j.restart_hint), 1200);
        // 装完把本机扩展列表刷新一遍，不然切回「扩展」看到的还是旧的
        refreshData();
      } else {
        OL.installing = "";
        dialog("安装失败", [j.error || "未知错误"].join("\n"), [{ label: "知道了" }]);
        renderList();
      }
    })
    .catch(err => {
      OL.installing = "";
      dialog("安装失败", ["请求没发出去：" + String(err && err.message || err),
        "本地服务可能已经退出了，重新运行「启动管理中心.bat」再试。"].join("\n"),
        [{ label: "知道了" }]);
      renderList();
    });
}

/* ================= 视图：定时任务 ================= */
function rruleText(s) {
  if (!s) return "一次性";
  const g = k => (s.match(new RegExp(k + "=([^;]+)")) || [])[1];
  const f = g("FREQ"), iv = g("INTERVAL"), bh = g("BYHOUR"), bm = g("BYMINUTE");
  const day = (g("BYDAY") || "").split(",").map(x =>
    ({ MO: "周一", TU: "周二", WE: "周三", TH: "周四", FR: "周五", SA: "周六", SU: "周日" }[x.trim()] || x)).join("、");
  const t = (bh || bm) ? " " + String(bh || "0").padStart(2, "0") + ":" + String(bm || "0").padStart(2, "0") : "";
  if (f === "DAILY") return (iv && iv !== "1" ? "每 " + iv + " 天" : "每天") + t;
  if (f === "WEEKLY") return "每" + (day || "周") + t;
  if (f === "MONTHLY") return "每月 " + (g("BYMONTHDAY") || "") + " 日" + t;
  if (f === "HOURLY") return "每 " + (iv || 1) + " 小时";
  return s;
}
function renderAutomations() {
  // 「已执行完」= 一次性任务且没有下次运行时间。
  // WorkBuddy 不会自动把 status 从 ACTIVE 改掉，所以只看 status 会把早就跑完的
  // 一次性任务算成「启用中」—— 判据必须带上 next_run_at。
  const isExpired = a => a.schedule_type === "once" &&
    !a.next_run_at && (!!a.last_run_at || a.status !== "ACTIVE");

  let as = (DATA.automations || []).slice();
  if (state.autoScope === "live") as = as.filter(a => !a.deleted && !isExpired(a));
  else if (state.autoScope === "done") as = as.filter(a => !a.deleted && isExpired(a));
  else if (state.autoScope === "deleted") as = as.filter(a => a.deleted);
  const q = state.q.toLowerCase();
  if (q) as = as.filter(a => ((a.name || "") + " " + (a.prompt || "") + " " + (a.cwds || []).join(" ")).toLowerCase().includes(q));

  if (!as.length) return '<div class="empty"><div class="big">⏰</div><div class="t">没有匹配的定时任务</div></div>';

  const live = as.filter(a => !a.deleted).length;
  const running = as.filter(a => !a.deleted && !isExpired(a)).length;
  let h = '<div class="tools"><span>共 ' + as.length + " 个（启用中 " + running +
    (live !== running ? " · 已执行完 " + (live - running) : "") + "）</span></div>";
  h += '<table class="tbl"><thead><tr>' +
    "<th>名称</th><th>计划</th><th>状态</th><th>下次运行</th><th>上次运行</th><th>目录</th><th style=\"text-align:right\">操作</th>" +
    "</tr></thead><tbody>";
  as.forEach(a => {
    // 状态判定：
    //   已删除              -> 已删除
    //   一次性 + 没有下次运行 -> 已执行完（WorkBuddy 的 status 字段不会自动改，
    //                          只看 status 会把早就跑完的一次性任务显示成「启用」）
    //   其余 ACTIVE         -> 启用
    const st = a.deleted
      ? '<span class="badge b-del">已删除</span>'
      : (isExpired(a)
        ? '<span class="badge b-off" title="这个一次性任务已经执行过了">已执行完</span>'
        : (a.status === "ACTIVE" ? '<span class="badge b-done">启用</span>' : '<span class="badge b-mode">' + esc(a.status || "—") + "</span>"));
    h += "<tr>";
    h += '<td class="c-name"><div class="nm">' + esc(a.name || "(未命名)") + "</div>" +
      (a.prompt ? '<div class="pth">' + esc(a.prompt.slice(0, 70)) + "</div>" : "") + "</td>";
    h += '<td class="nowrap">' + esc(rruleText(a.rrule)) +
      (a.schedule_type === "once" && a.scheduled_at ? '<div class="pth">' + esc(fmtTime(a.scheduled_at)) + "</div>" : "") + "</td>";
    h += '<td class="nowrap">' + st + "</td>";
    h += '<td class="nowrap">' + (a.next_run_at ? esc(fmtTime(a.next_run_at)) : "—") + "</td>";
    h += '<td class="nowrap">' + (a.last_run_at ? esc(fmtTime(a.last_run_at)) + (a.run_count ? '<div class="pth">已运行 ' + a.run_count + " 次</div>" : "") : "—") + "</td>";
    h += '<td class="pth">' + esc((a.cwds || []).join(", ") || "—") + "</td>";
    h += '<td style="text-align:right;white-space:nowrap">';
    if (!a.deleted) {
      h += '<button class="act" data-auto-rename="' + esc(a.id) + '">改名</button> ';
      h += '<button class="act" data-auto-toggle="' + esc(a.id) + '">' + (a.status === "ACTIVE" ? "暂停" : "启用") + "</button> ";
      h += '<button class="act danger" data-auto-del="' + esc(a.id) + '">删除</button>';
    } else {
      h += '<button class="act" data-auto-restore="' + esc(a.id) + '">恢复</button>';
    }
    h += "</td></tr>";
  });
  h += "</tbody></table>";
  return h;
}

    h += '<div class="sect-t" style="margin-top:22px">我配置的目录</div>';
    h += '<div class="note">这些是在「设置与日志」里配的常用位置，可增删。</div>';

    roots.forEach(r => {
      h += '<div class="pcard' + (r.missing ? " miss" : "") + '">';
      h += '<div class="pn">🗄️ ' + esc(r.name) + (r.missing ? "（目录不存在）" : "") + "</div>";
      h += '<div class="pp mono">' + esc(r.path) + "</div>";
      h += '<div class="pst">' +
        (!r.missing && r.child_count != null ? "<span>顶层 <b>" + r.child_count + "</b> 项</span>" : "") +
        (!r.missing && r.top_bytes ? "<span>直接文件 <b>" + fmtSize(r.top_bytes) + "</b></span>" : "") +
        "</div>";
      h += '<div class="pp" style="color:var(--text-2);font-size:12.5px">' + esc(r.desc || "") + "</div>";
      h += '<div class="acts">' +
        (r.missing
          ? '<span style="color:var(--warn,var(--text-3));font-size:12.5px">这个目录已不存在，去「设置与日志」里改</span>'
          : '<button class="act pri" data-lib="' + esc(r.path) + '">浏览</button>' +
            '<button class="act" data-reveal="' + esc(r.path) + '">在资源管理器打开</button>') +
        "</div></div>";
    });
    h += "</div>";
  }
  return h;
}

function renderLibraryBrowse(roots) {
  const ent = window.__LIB_CACHE__ && window.__LIB_CACHE__.path === state.libPath
    ? window.__LIB_CACHE__ : null;
  let h = "";
  // 面包屑：首页 → 上一级 → 当前
  h += '<div class="crumb">';
  h += '<span class="lnk" data-lib-root="1">🗄️ 资料库</span>';
  if (ent && ent.parent) h += '<span class="sep">/</span><span class="lnk" data-lib="' +
    esc(ent.parent) + '">↑ 上一级</span>';
  h += '<span class="sep">/</span><b class="mono">' + esc(state.libPath) + "</b>";
  h += '<button class="act" style="margin-left:auto" data-reveal="' + esc(state.libPath) +
    '">在资源管理器打开</button>';
  h += '<button class="act" data-copy="' + esc(state.libPath) + '">复制路径</button>';
  h += "</div>";

  if (!ent) {
    h += '<div class="empty"><div class="t">目录内容未加载</div>' +
      (SERVER ? "<div>正在读取…</div>" :
        "<div>静态模式下无法浏览子目录，请用「启动管理中心.bat」打开</div>") + "</div>";
    return h;
  }
  let list = ent.entries || [];
  const q = state.q.toLowerCase();
  if (q) list = list.filter(e => (e.name || "").toLowerCase().includes(q));
  if (!list.length) {
    return h + '<div class="empty"><div class="big">📂</div><div class="t">' +
      (q ? "没有匹配「" + esc(state.q) + "」的文件" : "这个目录是空的") + "</div></div>";
  }

  h += '<table class="tbl lt"><thead><tr><th>名称</th><th>大小</th><th>修改时间</th></tr></thead><tbody>';
  list.forEach(e => {
    h += '<tr data-row="lib:' + esc(e.path) + '">';
    h += '<td class="c-pname"><span class="ell nm" ' +
      (e.is_dir ? 'data-lib="' + esc(e.path) + '"' : 'data-open="' + esc(e.path) + '"') + ">" +
      (e.is_dir ? "📁 " : "📄 ") + esc(e.name) + "</span></td>";
    h += "<td>" + (e.is_dir ? "—" : fmtSize(e.size)) + "</td>";
    h += "<td>" + esc(fmtTime(e.mtime)) + "</td>";
    h += "</tr>";
  });
  h += "</tbody></table>";
  if (ent.truncated) h += '<div class="note">目录内容超过上限，只显示了前 ' + list.length + " 项。</div>";

  // 异步加载真实内容
  if (SERVER) setTimeout(loadLib, 0);
  return h;
}
function loadLib() {
  if (!SERVER || !state.libPath) return;
  fetch("/api/ls?path=" + encodeURIComponent(state.libPath))
    .then(parseJson).then(j => {
      if (!j.ok) { toast("读取目录失败：" + (j.error || ""), "err"); return; }
      window.__LIB_CACHE__ = { path: state.libPath, parent: j.parent, entries: j.entries, truncated: j.truncated };
      render();
    }).catch(() => toast("读取目录失败", "err"));
}

/* ================= 视图：账户 =================
   //
   // 明哥的要求：把「点头像进去」那一套也搬进来 —— 积分余额、设置、记忆、
   // 检查更新、领取每日积分、成长计划。
   //
   // 一个必须讲清楚的事实：**积分这些数据拿不到**。
   // 它们要登录令牌，令牌在系统加密存储里 —— 一个本地小工具去解密主程序的
   // 凭据，既不稳也不该。所以这里的分工是：
   //   · 本地能读的（账户信息、版本、记忆文件）→ 直接显示
   //   · 需要登录态的（积分/签到/成长计划）   → 做成入口，唤起客户端或开网页
   // 页面上会把这两类明确区分开，不假装能看。
*/
const ACCT = { data: null, loading: false, err: "" };

function renderAccount() {

  }
  if (ACCT.err) {
    return '<div class="note"><b>读取失败：</b>' + esc(ACCT.err) +
      (SERVER ? "" : "<br>账户信息需要本地服务（启动管理中心.bat）。") + "</div>";
  }
  const d = ACCT.data || {};
  const a = d.account || {};
  const c = d.client || {};
  const mem = d.memory || { groups: [], total: 0 };

  let h = '<div class="acct">';

  // ---------- 1) 账户 ----------
  h += '<div class="acard">';
  h += "<h3><span class=\"ico\">👤</span>账户</h3>";
  if (a.nickname || a.uid) {
    const initial = (a.nickname || "?").slice(0, 1);
    h += '<div class="who"><div class="avatar">' + esc(initial) + "</div><div>";
    h += '<div class="nm">' + esc(a.nickname || "（未登录）") + "</div>";
    h += '<div class="sub">' + esc(editionLabel(a)) + "</div></div></div>";
    h += '<dl class="kv">';
    if (a.uid) h += '<dt>UID</dt><dd class="mono">' + esc(a.uid.slice(0, 18)) + "…</dd>";
    if (a.type) h += "<dt>类型</dt><dd>" + esc(a.type === "personal" ? "个人版" : a.type) + "</dd>";
    if (a.saved_at) h += "<dt>快照于</dt><dd>" + fmtTime(a.saved_at) + "</dd>";
    h += "</dl>";
  } else {
    h += '<div class="ol-hint">没找到本机账户快照 —— 可能还没在这台机器上登录过 WorkBuddy。</div>';
  }
  h += "</div>";

  // ---------- 2) 客户端 ----------
  h += '<div class="acard">';
  h += "<h3><span class=\"ico\">🖥️</span>客户端</h3>";
  h += '<dl class="kv">';
  h += "<dt>版本</dt><dd>" + (c.version ? "<b>" + esc(c.version) + "</b>" : "—") + "</dd>";
  if (c.product) h += "<dt>产品</dt><dd>" + esc(c.product) + "</dd>";
  if (c.endpoint) h += '<dt>服务端</dt><dd class="mono" style="font-size:11.5px">' +
    esc(c.endpoint) + "</dd>";
  h += '<dt>数据目录</dt><dd class="mono" style="font-size:11.5px">' + esc(c.data_dir || "") + "</dd>";
  h += "</dl>";
  h += '<div class="dr-acts" style="margin-top:11px">';
  if (c.exe) h += '<button class="act" data-reveal="' + esc(c.exe) + '">📂 打开安装目录</button>';
  h += '<button class="act" id="btn-ckupd">🔄 检查更新</button>';
  h += "</div>";
  h += '<div id="ckupd-box"></div>';
  h += "</div>";

  // ---------- 3) 积分与活动 ----------
  h += '<div class="acard">';
  h += "<h3><span class=\"ico\">🎁</span>积分与活动</h3>";
  h += '<div class="note" style="margin:0 0 11px;font-size:12px">' +
    "积分余额、签到、成长计划都需要<b>登录态</b>才能读 —— 本页只读本地数据，" +
    "不碰你的登录凭据。点下面的入口去客户端里看（那里本来就登录着）。" +
    "<br><b>签到具体在哪：</b>客户端<b>左下角头像</b> → 「<b>Buddy加油站</b>」 → 「签到领积分」。" +
    "签到气泡只在客户端<b>启动时</b>自动弹一次，关掉后本次运行不再弹（它的设计如此）；" +
    "按这条路径能随时把气泡叫回来，不必重启。</div>";
  (d.links || []).forEach(l => {
    h += '<div class="lnk" data-acctlink="' + esc(l.url) + '" data-kind="' + esc(l.kind) + '">' +
      '<span class="i">' + linkIcon(l.id) + "</span>" +
      '<span style="min-width:0"><span class="t">' + esc(l.label) + "</span>" +
      '<div class="h">' + esc(l.hint || "") + "</div></span>" +
      '<span class="arrow">↗</span></div>';

  // ---------- 4) 记忆 ----------
  h += '<div class="acard" style="grid-column:span 2">';
  h += "<h3><span class=\"ico\">🧠</span>记忆文件 <span style=\"font-weight:400;" +
    "color:var(--text-3);font-size:11.5px\">共 " + (mem.total || 0) + " 个 · 只读</span></h3>";
  if (!mem.groups || !mem.groups.length) {
    h += '<div class="ol-hint">没有找到记忆文件。</div>';
  } else {
    mem.groups.forEach(g => {
      h += '<div style="margin-bottom:13px">';
      h += '<div style="font-size:12.5px;font-weight:650;color:var(--text);' +
        'margin-bottom:6px">' + esc(g.label) +
        ' <span style="font-weight:400;color:var(--text-3);font-size:11.5px">' +
        esc(g.desc) + " · " + g.items.length + " 个</span></div>";
      g.items.slice(0, 40).forEach(it => {
        h += '<div class="mem-item" data-mem="' + esc(it.path) + '">' +
          '<span class="fi">' + (it.name.endsWith(".json") ? "⚙️" : "📝") + "</span>" +
          '<span class="mn" title="' + esc(it.path) + '">' + esc(it.title || it.name) + "</span>" +
          '<span class="ms">' + fmtSize(it.size) + " · " + relTime(it.mtime) + "</span>" +
          '<span class="go">查看 ›</span></div>';
      });
      if (g.items.length > 40) {
        h += '<div class="ol-hint" style="margin-left:10px">（还有 ' +
          (g.items.length - 40) + " 个未列出）</div>";
      }
      h += "</div>";
    });
  }
  h += "</div>";

  h += "</div>";
  return h;
}

function editionLabel(a) {
  const ed = { free: "免费版", pro: "专业版", team: "团队版", enterprise: "企业版" }[a.edition] || a.edition || "";
  const bits = [];
  if (a.is_pro) bits.push("Pro");
  if (ed) bits.push(ed);
  if (a.is_admin) bits.push("管理员");
  return bits.join(" · ") || "—";
}

function linkIcon(id) {
  return { credits: "💰", checkin: "📅", growth: "🌱", settings: "⚙️", home: "🏠" }[id] || "🔗";
}

function loadAccount() {
  if (!SERVER) {
    ACCT.err = "账户信息需要本地服务";
    renderList();
    return;
  }
  ACCT.loading = true;
  renderList();
  fetch("/api/account").then(parseJson).then(j => {
    ACCT.loading = false;
    if (j && j.ok) ACCT.data = j;
    else ACCT.err = (j && j.error) || "未知错误";
    renderList();
  }).catch(e => {
    ACCT.loading = false;
    ACCT.err = String(e);
    renderList();
  });
}

        { label: "在资源管理器中打开", fn: () => revealPath(j.path) },
        { label: "关闭", kind: "pri" },
