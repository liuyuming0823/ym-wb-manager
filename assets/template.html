    }).catch(() => toast("读取失败", "err"));
}

/* 检查更新 */
function doCheckUpdate() {
  const box = $("#ckupd-box");
  if (!box) return;
  if (!SERVER) { toast("需要本地服务", "err"); return; }
  box.innerHTML = '<div class="ol-hint" style="margin-top:9px">正在检查…（会联网比对 SkillHub 上的版本）</div>';
  fetch("/api/check-update").then(parseJson).then(j => {
    if (!j || !j.ok) {
      box.innerHTML = '<div class="note" style="margin:9px 0 0;font-size:12px">检查失败：' +
        esc((j && j.error) || "未知错误") + "</div>";
      return;
    }
    let h = "";
    const n = j.outdated_count || 0;
    const ahead = (j.skills || []).filter(s => s.ahead);
    if (n) {
      h += '<div class="note" style="margin:9px 0 0;font-size:12px"><b>有 ' + n +
        " 个技能可以更新：</b>";
      h += '<div style="margin-top:6px">';
      (j.skills || []).filter(s => s.outdated).slice(0, 12).forEach(s => {
        h += '<div style="margin:3px 0">· <b>' + esc(s.display_name || s.dir) + "</b> " +
          '<span class="mono">' + esc(s.version) + " → " + esc(s.latest) + "</span></div>";
      });
      h += "</div>";
      h += '<div style="margin-top:7px;color:var(--text-3)">' +
        "本页只报告，不自动更新（能悄悄改写自己文件的技能本身就是风险面）。" +
        '更新请用 <span class="mono">skillhub upgrade</span> 或 ym-skillhub 技能。</div>';
    } else {
      h += '<div class="note info" style="margin:9px 0 0;font-size:12px">' +
        "已检查 " + (j.checked_count || 0) + " 个已上架技能，没有发现新版本。" +
        (j.self ? ' 管理中心自身 v' + esc(j.self.version) : "") + "</div>";
    }
    // 本地比线上还新：不是「可以更新」，说清楚，免得用户以为该去装旧版
    if (ahead.length) {
      h += '<div class="ol-hint" style="margin-top:7px">本地版本比线上新的有 ' +
        ahead.length + " 个（本地改过、或线上还没跟上）：";
      ahead.slice(0, 8).forEach(s => {
        h += '<span style="margin-left:6px">' + esc(s.display_name || s.dir) +
          ' <span class="mono">' + esc(s.version) + "</span></span>";
      });
      h += "</div>";
    }
    // 🔴「没上架」和「出错」要分开说。
    //
    // 本机 46 个本地技能里只有 13 个发到了 SkillHub。早先一律算「错误」，
    // 页面显示「33 个错误」——用户以为工具坏了，其实什么都没坏。
    // 未上架是**最常见的一种正常结果**，用普通提示；errors 只留给真出问题的。
    const npub = j.not_published || [];
    if (npub.length) {
      h += '<div class="ol-hint" style="margin-top:7px">另外 ' + npub.length +
        " 个是本机自制或还没上架的技能，线上没有对应条目，不参与版本比对：" +
        npub.slice(0, 6).map(x => esc(x.display_name || x.dir || x.slug || String(x))).join("、") +
        (npub.length > 6 ? " 等" : "") + "</div>";
    }
    // 真出错的（联网失败 / 超时 / 接口报错）才用醒目样式
    const errs = j.errors || [];
    if (errs.length) {
      h += '<div class="note" style="margin:9px 0 0;font-size:12px">有 ' + errs.length +
        " 个技能这次没查成（网络或接口问题，可稍后重试）：" +
        errs.slice(0, 6).map(x => esc(x.dir || x.slug || String(x))).join("、") +
        (errs.length > 6 ? " 等" : "") + "</div>";
    }
    if (j.client && j.client.version) {
      h += '<div class="ol-hint" style="margin-top:7px">客户端版本：' +
        esc(j.client.version) + "（客户端本身的更新请用客户端自带入口）</div>";
    }
    box.innerHTML = h;
  }).catch(e => {
    box.innerHTML = '<div class="note" style="margin:9px 0 0;font-size:12px">检查失败：' +
      esc(String(e)) + "</div>";
  });
}

// 页面上的临时状态。所有改动先留在这里，点「保存」才回写服务端 ——
// 免得每敲一个字符就落盘一次，改错了也没法反悔。
let CFG = null, CFG_ROOTS = [];

function loadCfg() {
  api("/api/config").then(j => {
    if (!j.ok) { $("#lib-roots").innerHTML = '<div class="empty">读取失败：' + esc(j.error || "") + "</div>"; return; }
    CFG = j;
    CFG_ROOTS = (j.library_roots || []).map(r => ({ name: r.name, path: r.path, desc: r.desc || "", missing: r.missing }));
    paintRoots();
    const pe = $("#cfg-port"); if (pe) pe.value = j.port;
    const ke = $("#cfg-keep"); if (ke) ke.value = j.keep_backups;
  }).catch(() => {
    const el = $("#lib-roots");
    if (el) el.innerHTML = '<div class="empty">读取失败（服务未运行？纯静态页不支持修改配置）</div>';
  });
}

function paintRoots() {
  const box = $("#lib-roots");
  if (!box) return;
  if (!CFG_ROOTS.length) {
    box.innerHTML = '<div class="empty">还没有任何目录。点「添加目录」加一个，或点「重新自动探测」让工具自己找。</div>';
    return;
  }
  let h = '<table class="tbl"><thead><tr><th style="width:150px">显示名</th><th>路径</th><th style="width:70px"></th></tr></thead><tbody>';
  CFG_ROOTS.forEach((r, i) => {
    h += "<tr>" +
      '<td><input type="text" data-ri="' + i + '" data-rf="name" value="' + esc(r.name) + '" style="width:100%"></td>' +
      '<td><input type="text" data-ri="' + i + '" data-rf="path" value="' + esc(r.path) + '" ' +
        'class="mono" style="width:100%;font-size:11.5px">' +
        (r.missing ? '<div style="color:var(--warn);font-size:11.5px;margin-top:3px">这个目录不存在（可能被删了或换了电脑）</div>' : "") +
      "</td>" +
      '<td style="text-align:right"><button class="act" data-rdel="' + i + '">删除</button></td></tr>';
  });
  h += "</tbody></table>";
  box.innerHTML = h;
  // 输入框改的是内存里的副本，不是 CFG_ROOTS 本身 —— 保存时才真正提交
  box.querySelectorAll("input[data-ri]").forEach(inp => {
    inp.addEventListener("input", e => {
      const i = +e.target.dataset.ri, f = e.target.dataset.rf;
      if (CFG_ROOTS[i]) CFG_ROOTS[i][f] = e.target.value;
    });
  });
  box.querySelectorAll("button[data-rdel]").forEach(b => {
    b.addEventListener("click", e => {
      const i = +e.currentTarget.dataset.rdel;
      CFG_ROOTS.splice(i, 1);
      paintRoots();
    });
  });
}

function addRoot() {
  CFG_ROOTS.push({ name: "新目录", path: "", desc: "" });
  paintRoots();
}

function probeRoots() {
  api("/api/suggest").then(j => {
    if (!j.ok) { toast("探测失败：" + (j.error || ""), "err"); return; }
    const found = j.roots || [];
    if (!found.length) { toast("没有探测到可用目录", "err"); return; }
    // 追加而不是替换 —— 用户手动加的那些不该被探测结果冲掉。
    // 已经有的路径跳过，避免重复点几次堆出一堆一样的。
    const have = new Set(CFG_ROOTS.map(r => (r.path || "").toLowerCase()));
    let added = 0;
    found.forEach(r => {
      if (!have.has(r.path.toLowerCase())) {
        CFG_ROOTS.push({ name: r.name, path: r.path, desc: r.desc || "" });
        added++;
      }
    });
    paintRoots();
    toast(added ? ("探测到 " + added + " 个新目录，点「保存」生效") : "没有新的目录", "ok");
  }).catch(() => {});
}

function saveRoots() {
  const payload = CFG_ROOTS
    .filter(r => (r.path || "").trim())
    .map(r => ({ name: r.name, path: r.path.trim(), desc: r.desc || "" }));
  api("/api/config", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ library_roots: payload })
  }).then(j => {
    if (j.ok) { toast(j.message || "已保存", "ok"); loadCfg(); }
    else toast("保存失败：" + (j.error || ""), "err");
  }).catch(() => {});
}

function saveRunCfg() {
  const p = $("#cfg-port"), k = $("#cfg-keep");
  api("/api/config", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      port: p ? p.value : undefined,
      keep_backups: k ? k.value : undefined
    })
  }).then(j => {
    if (j.ok) { toast(j.message || "已保存", "ok"); loadCfg(); }
    else toast("保存失败：" + (j.error || ""), "err");
  }).catch(() => {});
}

let DOCTOR_TEXT = "";

function runDoctor() {
  const box = $("#doctor-box");
  if (box) box.innerHTML = '<div class="empty">正在检查…</div>';
  api("/api/doctor").then(j => {
    if (!j.ok) { if (box) box.innerHTML = '<div class="empty">体检失败：' + esc(j.error || "") + "</div>"; return; }
    renderDoctor(j);
  }).catch(() => {
    if (box) box.innerHTML = '<div class="empty">体检失败（服务未运行？）</div>';
  });
}

function renderDoctor(rep) {
  const box = $("#doctor-box");
  if (!box) return;
  const rows = rep.results || [];
  const s = rep.summary || { ok: 0, warn: 0, bad: 0 };
  const cls = { ok: "b-done", warn: "b-warn", bad: "b-err" };
  const word = { ok: "正常", warn: "注意", bad: "问题" };
  let h = '<div class="box">';
  h += '<div style="margin-bottom:8px">正常 <b style="color:var(--ok)">' + s.ok + "</b> · 注意 <b>" +
    s.warn + "</b> · 问题 <b>" + s.bad + "</b></div>";
  let last = null;
  rows.forEach(r => {
    if (r.group !== last) {
      h += '<div style="margin:10px 0 4px;font-size:11.5px;color:var(--text-3)">' + esc(r.group) + "</div>";
      last = r.group;
    }
    h += '<div style="margin-bottom:6px;font-size:12.5px">' +
      '<span class="badge ' + (cls[r.level] || "") + '">' + (word[r.level] || r.level) + "</span> " +
      "<b>" + esc(r.name) + "</b> " + esc(r.detail || "") +
      (r.hint ? '<div style="color:var(--text-3);margin:2px 0 0 6px">→ ' + esc(r.hint) + "</div>" : "") +
      "</div>";
  });
  if (rep.config_path) {
    h += '<div style="margin-top:10px;font-size:11.5px;color:var(--text-3)">配置文件：' +
      '<span class="mono">' + esc(rep.config_path) + "</span></div>";
  }
  h += "</div>";
  box.innerHTML = h;

  // 存一份纯文本，方便用户直接粘到聊天窗口发人求助 ——
  // 这是「别人电脑上跑不动」最常见的求助方式，别让人手抄。
  DOCTOR_TEXT = "WorkBuddy 管理中心 · 环境体检\n" +
    "正常 " + s.ok + " / 注意 " + s.warn + " / 问题 " + s.bad + "\n" +
    rows.map(r => "[" + (word[r.level] || r.level) + "] " + r.name + "：" + (r.detail || "") +
      (r.hint ? "  → " + r.hint : "")).join("\n") +
    "\n配置文件：" + (rep.config_path || "");
}

function copyDoctor() {
  if (!DOCTOR_TEXT) { toast("先点「开始体检」", "err"); return; }
  const done = () => toast("体检结果已复制，可直接粘贴给别人", "ok");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(DOCTOR_TEXT).then(done).catch(() => fallbackCopy(DOCTOR_TEXT, done));
  } else {
    fallbackCopy(DOCTOR_TEXT, done);
  }
}

function fallbackCopy(text, done) {
  // navigator.clipboard 在非 https / 非 localhost 下不可用，
  // 而这个页面可能被 file:// 直接打开，所以必须留一条兜底路径
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); }
  catch (e) { toast("复制失败，请手动选中", "err"); }
  document.body.removeChild(ta);
}

/* 行内改标题 —— 在列表里直接改，不弹窗。
 *
 * 走的是同一个 /api/rename 接口，和弹窗版 doRename() 完全等价，
 * 只是把输入框直接放到单元格里。两个细节：
 *   1. blur 和 Enter 都可能触发保存，用一个 done 标志防止提交两次
 *   2. Esc 取消时也要把 done 置上，否则随后的 blur 又把改动提交了
 */
function startInlineEdit(td) {
  if (td.querySelector("input.rin")) return;
  const id = td.querySelector("[data-edit]").dataset.edit;
  const t = (DATA.tasks || []).find(x => x.id === id);
  if (!t) return;
  const cur = t.custom_title || "";
  const span = td.querySelector("[data-edit]");
  const html = span.innerHTML;
  span.style.display = "none";

  const inp = document.createElement("input");
  inp.className = "rin";
  inp.type = "text";
  inp.maxLength = 200;
  inp.value = cur;                     // 只填「手动标题」，不填自动标题 —— 否则
  inp.placeholder = "留空 = 用自动标题";  // 一保存就把自动标题误当成手动的存进去
  td.appendChild(inp);
  inp.focus();
  inp.select();

  let done = false;
  const finish = (save) => {
    if (done) return;
    done = true;
    const v = inp.value.trim();
    inp.remove();
    span.style.display = "";
    if (!save) return;
    // 没变就直接返回，避免白写一次数据库 + 白备份一份
    if (v === cur) return;
    api("/api/rename", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id, title: v })
    }).then(j => {
      if (j.ok) { toast(j.message || "已改名", "ok"); refreshData(); }
      else { toast("改名失败：" + (j.error || ""), "err"); span.innerHTML = html; }
    }).catch(() => { span.innerHTML = html; });
  };
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); finish(true); }
    else if (e.key === "Escape") { e.preventDefault(); finish(false); }
    e.stopPropagation();   // 别让 Esc 冒泡到全局（那里会去清空搜索框）
  });
  inp.addEventListener("blur", () => finish(true));
  inp.addEventListener("click", e => e.stopPropagation());
}

/* ================= 主渲染 ================= */
//
// 分三层，边界很清楚：
//   render()      完整渲染（切视图、刷新数据时用）—— 会重建工具条
//   renderList()  只重画内容区（打字、改筛选条件时用）—— **绝不碰工具条**
//   renderChrome() 只画顶栏/侧栏/工具条
//
// 打字走 renderList() 是关键：它不碰 #bar，输入框 DOM 一直活着，
// 光标和输入法组字都不会被打断。（这就是「打不了字」的修复点。）
function render() {
  renderChrome();
  renderList();
}
function renderList() {
  // 快捷筛选/搜索条件变化会改变「当前结果条数」，顶栏可能要有提示，
  // 但顶栏不含输入控件，重建它不会影响打字，所以这里是安全的。
  renderSidebar();
  let h = "";
  if (state.view === "overview") h = renderOverview();
  else if (state.view === "tasks" || state.view === "trash") h = renderTasks();
  else if (state.view === "projects") h = renderProjects();
  else if (state.view === "automations") h = renderAutomations();
  else if (state.view === "plugins") h = renderPlugins();
  else if (state.view === "online") h = renderOnline();
  else if (state.view === "library") h = renderLibrary();
  else if (state.view === "account") h = renderAccount();
  else if (state.view === "settings") h = renderSettings();
  $("#main").innerHTML = h;
  applyColWidths();
  bindInMain();
}

/* #main 里那些**不进工具条**的控件（它们的生命跟着 renderList 走，
   所以不能像工具条那样只绑一次，得每次重画后重绑）。
   注意：绝不能在这里碰 #bar —— 那个区域里的输入框正在打字。 */
function bindInMain() {
  const oq = $("#ol-q");
  if (oq) {
    // 打字只更新状态，不重画（否则光标会丢）
    oq.addEventListener("input", e => { OL.q = e.target.value; });
    oq.addEventListener("keydown", e => {
      if (e.key === "Enter") { OL.q = e.target.value; runOnlineSearch(); }
    });
  }
  const og = $("#ol-go");
  if (og) og.addEventListener("click", () => {
    const i = $("#ol-q"); if (i) OL.q = i.value;
    runOnlineSearch();
  });
  const oc = $("#ol-clear");
  if (oc) oc.addEventListener("click", () => {
    OL.results = null; OL.err = ""; OL.q = "";
    const i = $("#ol-q"); if (i) i.value = "";
    const ib = $("#ol-qbar"); if (ib) ib.value = "";
    renderList();
  });
}

/* ================= 事件委托 ================= */

/* ---- 列宽拖拽 ----
 *
 * 必须挂在 click **之前**（监听顺序 = 注册顺序），因为手柄就在 th 里面，
 * 而 th 自己带 data-sortkey 会触发排序。按下时 stopPropagation 只能挡住
 * 冒泡，挡不住同一个元素上后注册的 click —— 所以用 mousedown 阶段抢先接管：
 * 一旦落点在手柄上就进入拖拽态，同时给这个 th 打个「刚刚在拖拽」的标记，
 * click 那边看到标记就直接 return，避免「拖完松手顺手把表也排了序」。
 */
document.addEventListener("mousedown", e => {
  const h = e.target.closest && e.target.closest(".lt th .rsz");
  if (!h) return;
  const th = h.closest("th");
  if (!th) return;
  startColResize(e, h);
});
// 拖完那次 click 要吞掉（否则会顺带排序 / 展开行）
document.addEventListener("click", e => {
  if (SUPPRESS_CLICK) { SUPPRESS_CLICK = false; e.stopPropagation(); e.preventDefault(); }
}, true);
document.addEventListener("dblclick", e => {
  const h = e.target.closest && e.target.closest(".lt th .rsz");
  if (!h) return;                       // 双击手柄 = 恢复这一列
  const th = h.closest("th");
  if (!th || !th.dataset.colkey) return;
  setColWidth(state.view, th.dataset.colkey, "");
  applyColWidths();
  saveColWidths();
  toast("已恢复「" + (th.textContent || "").replace(/[⇅↑↓]/g, "").trim() + "」列宽", "ok");
});
// 表头右键 = 恢复本页全部列宽（放在列头上才生效，避免和普通右键冲突）
document.addEventListener("contextmenu", e => {
  const th = e.target.closest && e.target.closest(".lt th[data-colkey]");
  if (!th) return;
  e.preventDefault();
  resetColWidths(state.view);
});

document.addEventListener("click", e => {
  // 侧栏
  const nav = e.target.closest("#nav .nav-i");
  if (nav) {
    state.view = nav.dataset.view;
    if (state.view !== "library") { state.libPath = ""; }
    // 扩展页用的是另一套排序值（pname/pkind/…）。第一次切进来时 sort 还是
    // blankFilter 给的默认值 "updated"，而扩展的下拉里没有这一项 ——
    // 结果下拉框显示「名称」但内部值对不上，点表头会莫名其妙。这里对齐一下。
    if (state.view === "plugins" &&
        !/^p(name|kind|src|updated|inst)$/.test(state.sort || "")) {
      state.sort = "pname";
    }
    // 这里**不再**清 q / quick 等筛选条件。理由：筛选条件已经是按视图分开存的
    // （见 state.filters），切过去读到的是那个视图自己的那一份，
    // 天然不会带上别的页面的关键词。这里再清一遍反而会把用户
    // 「切走再切回来，搜索条件还在」的预期破坏掉。
    render();
    return;
  }
  // 统计卡片
  const cd = e.target.closest("[data-quick]");
  if (cd && !cd.classList.contains("flat")) {
    const qv = cd.dataset.quick;
    state.quick = (state.quick === qv) ? "" : qv;
    state.view = "tasks";
    render();
    return;
  }

  // 表头点击排序（只在表格式列表里有）
  const th = e.target.closest("th.srt[data-sortkey]");
  if (th) {
    const k = th.dataset.sortkey;
    // 点同一列 = 切换升/降；点新列 = 用它排序。
    // 这里的「切换升序」只对支持双向的列有意义，其余保持默认方向即可 ——
    // sortTasks() 内部按列名决定方向，所以这里只需要换 key。
    //
    // 🔴 扩展页的列名是 pname / pkind / … 另一套，**不能套用上面那行硬编码的
    // 任务页切换表**（会把 pname 切成 "updated"，而扩展页没有这个选项，
    // 结果点了没反应）。扩展页就直接按列排，方向由 sortPlugins() 按列决定。
    if (state.view === "plugins") {
      state.sort = k;
    } else if (state.sort === k) {
      state.sort = (k === "name" || k === "oldest") ? "updated" : (k === "created" ? "oldest" : "name");
    } else {
      state.sort = k;
    }
    syncBar();
    renderList();
    return;
  }

  // ---- 点整行展开 / 再次点击收缩（原「操作列 → 详情」按钮的替代）----
  //
  // 顺序很重要：行点击是**最宽**的命中区，必须放在所有行内小按钮之后判，
  // 否则点铅笔、点任务名、点复制图标都会被它抢走。所以这里先检测落点
  // 有没有落在「行内控件」上，有就放行给下面原有的分派。
  const tr = e.target.closest("tr[data-row]");
  if (tr && !e.target.closest("button,a,.pencil,[data-reopen],[data-edit],[data-copy]," +
      "[data-open],[data-reveal],[data-lib],[input],select,.rsz,.badge-soft")) {
    const id = tr.dataset.row;
    // 资料库的行是文件/目录，点行没有「展开详情」这回事 ——
    // 而且它们的 id 带 "lib:" 前缀，塞进 openSet 只会在集合里留垃圾。
    // 交给上面 data-lib / data-open 分支去处理（点名字才进目录 / 开文件）。
    if (id.startsWith("lib:")) return;
    if (openSet.has(id)) openSet.delete(id); else openSet.add(id);
    renderList();
    return;
  }

  // ---- 在线技能：安装 ----
  const oin = e.target.closest("[data-oin]");
  if (oin) {
    e.stopPropagation();
    doOnlineInstall(oin.dataset.oin, oin.dataset.ons || "", oin.dataset.over === "1");
    return;
  }

  // ---- 账户页：唤起客户端 / 打开网页 ----
  const al = e.target.closest("[data-acctlink]");
  if (al) {
    e.stopPropagation();
    const url = al.dataset.acctlink;
    const kind = al.dataset.kind || "app";
    if (!url) return;
    if (kind === "web") {
      // 网页入口：开新标签，别把管理中心自己顶掉 ——
      // 用户点「签到」是想顺手领个积分，不是想离开这个面板。
      window.open(url, "_blank", "noopener");
    } else {
      // app 协议：必须走 location.href，用 window.open 或 fetch 都唤不起来。
      // 客户端没装时浏览器不会有任何反应（不会有报错），所以这里先给个提示。
      try {
        toast("正在唤起客户端…");
        location.href = url;
      } catch (err) {
        toast("没能唤起客户端：" + url, "err");
      }
    }
    return;
  }

  // ---- 账户页：查看某个记忆文件 ----
  const mem = e.target.closest("[data-mem]");
  if (mem) { e.stopPropagation(); openMemory(mem.dataset.mem); return; }

  // ---- 账户页：检查更新 ----
  if (e.target.closest("#btn-ckupd")) { e.stopPropagation(); doCheckUpdate(); return; }

  // ---- 资料库：切页签 ----
  const lt = e.target.closest("[data-libt]");
  if (lt) { e.stopPropagation(); state.libTab = lt.dataset.libt; renderList(); return; }

  // ---- 唤起客户端 / 打开外部链接 ----
  //
  // 用途：有些东西**不在这台机器的磁盘上**，比如客户端的「资料库」里的
  // 「云端网盘 / 我的资料库」两块 —— 它们在腾讯云上，要登录，静态页面读不到。
  // 与其假装能展示，不如给个按钮直接把他送到那儿去。
  //
  // workbuddy:// 走 location.href（客户端注册了协议），http(s) 走 window.open
  // 免得把管理中心这个页面顶掉。
  const ou = e.target.closest("[data-open-url]");
  if (ou) {
    e.stopPropagation();
    const u = ou.dataset.openUrl || "";
    if (/^https?:\/\//i.test(u)) window.open(u, "_blank", "noopener,noreferrer");
    else location.href = u;
    return;
  }

  const el = e.target.closest("[data-toggle],[data-reopen],[data-copy],[data-reveal],[data-open]," +
    "[data-edit],[data-rename],[data-del],[data-restore],[data-purge],[data-lib],[data-lib-root],[data-proj-tasks]," +
    "[data-auto-rename],[data-auto-toggle],[data-auto-del],[data-auto-restore]");
  if (!el) return;

  const d = el.dataset;
  const stop = () => { e.stopPropagation(); };

  if (d.toggle !== undefined) {
    stop();
    const id = d.toggle;
    if (openSet.has(id)) openSet.delete(id); else openSet.add(id);
    // 不用类名切换，直接重画 —— 表格形态下展开会插入一整行 <tr>，
    // 只切 class 是画不出来的。
    renderList();
    return;
  }
  // 行内改标题：点「标题（手动）」单元格或铅笔按钮都走这里
  if (d.edit !== undefined) {
    stop();
    const td = el.closest("td");
    if (td) startInlineEdit(td);
    else doRename(d.edit);   // 兜底：不是在单元格里（理论上不会发生）
    return;
  }
  if (d.reopen !== undefined) { stop(); openTask(d.reopen, el.textContent); return; }
  if (d.copy !== undefined) { stop(); copy(d.copy); return; }
  if (d.reveal !== undefined) { stop(); revealPath(d.reveal); return; }
  if (d.open !== undefined) { stop(); if (d.open) openPath(d.open); else toast("该产物没有本地路径"); return; }
  if (d.rename !== undefined) { stop(); doRename(d.rename); return; }
  if (d.del !== undefined) { stop(); doDelete(d.del); return; }
  if (d.restore !== undefined) { stop(); doRestore(d.restore); return; }
  if (d.purge !== undefined) { stop(); doPurge(d.purge); return; }
  if (d.libRoot !== undefined) { stop(); state.libPath = ""; state.q = ""; window.__LIB_CACHE__ = null; render(); return; }
  if (d.lib !== undefined) {
    stop();
    state.libPath = d.lib; state.q = "";
    window.__LIB_CACHE__ = null;
    render();
    return;
  }
  if (d.projTasks !== undefined) {
    stop();
    state.view = "tasks"; state.q = d.projTasks; state.quick = "";
    render();
    return;
  }
  if (d.autoRename !== undefined) { stop(); doAutoRename(d.autoRename); return; }
  if (d.autoToggle !== undefined) { stop(); doAutoToggle(d.autoToggle); return; }
  if (d.autoDel !== undefined) { stop(); doAutoDelete(d.autoDel); return; }
  if (d.autoRestore !== undefined) { stop(); doAutoRestore(d.autoRestore); return; }
});

/* 刷新 */
function refreshData() {
  if (!SERVER) { showStaticHint(); return; }
  toast("正在重新采集…");
  fetch("/api/refresh", { method: "POST" }).then(parseJson).then(j => {
    if (j.ok && j.data) { applyData(j.data); toast("已更新", "ok"); }
    else toast("刷新失败：" + (j.error || "未知"), "err");
  }).catch(() => toast("本地服务未响应，请确认窗口还开着", "err"));
}
function applyData(d) {
  DATA.stats = d.stats;
  DATA.tasks = d.tasks;
  DATA.projects = d.projects;
  DATA.automations = d.automations;
  DATA.library_roots = d.library_roots;
  DATA.library_groups = d.library_groups;
  DATA.generated_at = d.generated_at;
  if (state.libPath) { window.__LIB_CACHE__ = null; }
  // 刷新数据后走 render()：数据换了，工具条里的选项/值与结果条数都可能要跟着变。
  // （打字路径不走这里，走 renderList()，所以不会打断输入。）
  render();
}

/* 深链：#view=tasks&quick=no-art&q=xxx */
//
// quick 的**合法值**就这几个（和筛选区按钮、统计卡片一一对应）：
//   no-art 无人问津 / stale 30天未动 / recent 近7天活跃 / lost 产物丢失
//
// 为什么要做别名归一：
// 界面文案是「无人问津」，内部值是 no-art，两者对不上。任何人（包括我自己）
// 手写深链时很容易照文案猜成 no-ask，结果 state.quick 拿到一个没人认识的字符串 ——
// 筛选标签会亮起来，却因为没有分支匹配而**一条都不过滤**，用户看到的是
// 「筛选状态是开着的，但列表没变」，属于最难排查的那种静默失效。
// 现在把常见猜法都收敛到规范值，猜错了也只是不筛选（并且会提示），不会半生效。
const QUICK_ALIAS = {
  "no-art": "no-art", "noart": "no-art", "no_art": "no-art",
  "no-ask": "no-art", "noask": "no-art",      // 「无人问津」的常见误拼
  "unused": "no-art", "无人问津": "no-art",
  "stale": "stale", "stale30": "stale", "30天未动": "stale",
  "recent": "recent", "active": "recent", "近7天活跃": "recent",
  "lost": "lost", "missing": "lost", "产物丢失": "lost",
};

function normalizeQuick(v) {
  if (!v) return "";
  const k = String(v).trim().toLowerCase();
  return QUICK_ALIAS[k] || "";
}

function applyHash() {
  const h = location.hash.replace(/^#/, "");
  if (!h) return;
  const p = new URLSearchParams(h);
  if (p.get("view")) state.view = p.get("view");

  const rawQuick = p.get("quick");
  if (rawQuick) {
    const q = normalizeQuick(rawQuick);
    if (q) {
      state.quick = q;
    } else {
      // 认不出来就明确说不认识，而不是留一个半生效的筛选状态
      state.quick = "";
      setTimeout(() => toast("不认识的筛选条件「" + rawQuick +
        "」，已忽略。可用：无人问津 / 30天未动 / 近7天活跃 / 产物丢失"), 300);
    }
  }

  if (p.get("q")) state.q = p.get("q");
  if (p.get("lib")) state.libPath = p.get("lib");
}

/* 启动 */
renderChrome();
applyHash();
render();
window.addEventListener("hashchange", () => { applyHash(); render(); });
// 快捷键 / 聚焦搜索
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
    const q = $("#q");
    if (q) { e.preventDefault(); q.focus(); }
  }
});
</script>
